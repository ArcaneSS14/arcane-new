name = "implementer"
description = "Implements bounded changes after repository ownership, access, localization, and verification requirements are proven."

instructions = """
Root AGENTS.md hard rules apply. Read scoped guidance and selected skills before editing.
Complete preflight with repository identity, owner tag, upstream, owner-local module and underscore paths, edit-marker syntax, assemblies, declarations, test owner, locale owner, allowed paths, and exact checks.
Never invent APIs.
Reuse existing projects, systems, fixtures, CI steps, resource directories, and locale files.

Edit markers, non-negotiable:
One added line is a bare trailing Arcane, never Arcane-Start. Two or more added lines use Arcane-Start / Arcane-End. One changed line is a trailing Arcane-Edit: <old> > <new>. Two or more changed lines use Arcane-Edit-Start / Arcane-Edit-End. More than 5 changed lines stay active inside an Arcane-Edit block; comment out removed content only when disabling it is intended. Never put a bare -Start or -End on a line instead of a pair. Never Trauma - , <Trauma>, Goobstation-, /* Trauma, or any other fork's marker.
No marker inside Arcane owner-local paths: Modules/Arcane/**, Content.Arcane.*, Resources/_Arcane/**. Nothing syncs there.
Mark Arcane changes inside Content.Trauma.*, Resources/_Trauma/**, *.Trauma.cs, Content.Medical.*, Resources/_Shitmed/**, and vanilla root paths. Editing a Trauma file is allowed and often correct; an unmarked change there is reverted by the next sync.
Changing a line that carries an upstream marker makes it ours, so it becomes # Arcane-Edit: <old> > <new>. Leave upstream markers on untouched lines alone.
Keep Trauma-file edits cheap: append to the end of a list, gather additions into one block, prefer additive over destructive, do not touch neighbours.
Full text: .agents/rules/arcane-edit-markers.md, .agents/rules/fork-trajectory-priority.md, .agents/rules/merge-conflict-resolution.md.

Prefer root Content.Arcane.* projects and existing _Arcane resource paths for Arcane-only changes and ports. Follow .agents/rules/port-destination.md for the narrow, provenance-based exception for confirmed TraumaStation additions and for content restored from a Trauma-side revert; those cases have different destinations. A necessary inherited/base integration change must be minimal and marked.

Treat English localization as structural truth. Add or edit Russian localization only when the user explicitly requests it. When requested, keep keys, attributes, variables, selectors, files, and message order aligned with English.
Run exact applicable commands and report results. Do not claim a check passed unless it ran.
"""

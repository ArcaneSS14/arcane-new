- type: entity
  parent: BaseWall
  id: WallCosmicCult
  name: malign wall
  description: A strange-looking wall. Staring at it for too long instills a sense of discomfort.
  components:
  - type: CosmicCultExamine
    cultistText: cosmic-examine-text-forthecult
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/cosmicwall.rsi
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwall.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    # Arcane-Edit-Start
    key: cultwalls
    states:
    - !type:CornerSpriteSmoothing
      mask: [ cultwalls ]
      base: malign
    # Arcane-Edit-End

- type: entity
  parent: WallCosmicCult
  id: WallCosmicCultTrimmed
  name: malign wall
  suffix: Trimmed
  components:
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwall.rsi
    state: full
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/cosmicwall.rsi
    # Arcane-Edit-Start
    layers:
    - state: full
  - type: IconSmooth
    key: cultwalls
    states:
    - !type:CornerSpriteSmoothing
      mask: [ cultwalls ]
      base: malign
    - !type:EdgeSpriteSmoothing
      mask: [ cultwalls ]
      base: trim_
    # Arcane-Edit-End

- type: entity
  parent: WindowRCDResistant
  id: WindowCosmicCult
  name: malign pane
  description: An odd-looking window. Something about it unnerves you.
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _DV/CosmicCult/Tileset/cosmicwindow.rsi
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwindow.rsi
    state: full
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    # Arcane-Edit-Start
    key: windows
    states:
    - !type:CornerSpriteSmoothing
      mask: [ windows ]
      base: malign
    # Arcane-Edit-End
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 3
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: RadiationBlocker
    resistance: 5

- type: entity
  id: WindowCosmicCultDark
  name: malign pane
  suffix: Tinted
  parent: WindowCosmicCult
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _DV/CosmicCult/Tileset/cosmicwindow_dark.rsi
  - type: Icon
    sprite: _DV/CosmicCult/Tileset/cosmicwindow_dark.rsi
    state: full
  - type: IconSmooth
    # Arcane-Edit-Start
    key: windows
    states:
    - !type:CornerSpriteSmoothing
      mask: [ windows ]
      base: cosDwindow
    # Arcane-Edit-End


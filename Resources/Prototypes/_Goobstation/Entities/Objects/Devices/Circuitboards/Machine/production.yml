- type: entity
  id: EngineeringTechFabCircuitboard
  parent: BaseMachineCircuitboard
  name: engineering techfab machine board
  description: A machine printed circuit board for a engineering techfab.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: EngineeringTechFab
    # stackRequirements: # Arcane-Edit: machine parts only
      # Manipulator: 4 # Arcane-Edit: replaced by machine parts
    tagRequirements:
      GlassBeaker:
        amount: 2
        defaultPrototype: Beaker
    # Arcane-Start
    partRequirements:
      Servo: 4
    # Arcane-End
  - type: Tag
    tags:
    - TechfabMachineBoard
    - DroneUsable


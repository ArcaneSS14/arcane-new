- type: entity
  parent: BaseMachineCircuitboard
  id: VinylPlayerCircuitboard
  name: vinyl player machine board
  description: A machine printed circuit board for a vinyl player.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: VinylPlayer
    stackRequirements:
      # Manipulator: 1 # Arcane-Edit: replaced by machine parts
      Steel: 1
      WoodPlank: 3
    # Arcane-Start
    partRequirements:
      Servo: 1
    # Arcane-End


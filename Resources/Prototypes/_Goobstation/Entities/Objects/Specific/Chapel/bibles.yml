- type: entity
  parent: Bible
  name: Quaran
  description: "Inshallah."
  id: BibleQuaran
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Chapel/allah.rsi
  - type: Item
    sprite: _Goobstation/Objects/Specific/Chapel/allah.rsi

- type: entity
  parent: Bible
  name: Tanakh
  description: "Choose life, that you and your offspring may live."
  id: BibleTanakh
  components:
  - type: Sprite
    sprite: _Goobstation/Wizard/Objects/scroll.rsi
    layers:
    - state: scroll2
  - type: Item
    sprite: _Goobstation/Wizard/Objects/scroll.rsi
    size: Small
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    damage:
      types:
        Blunt: 3

- type: entity
  parent: Bible
  name: clockwork slab
  description: A strange metal tablet. A clock in the center turns around and around.
  id: BibleSlabClockwork
  components:
  - type: Sprite
    sprite: _ShitChap/Objects/clockwork_slab.rsi
  - type: Item
    sprite: _ShitChap/Objects/clockwork_slab.rsi

- type: entity
  parent: [ BaseItem, BaseSetSelector ]
  id: ChaplainUndeterminedBible
  name: bluespace scripture beacon
  description: Though I walk through the valley of the shadow of death I will fear no evil, for you are with me.
  components:
  - type: Sprite
    sprite: _ShitChap/Objects/scripturebeacon.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - BibleSet
    - QuaranSet
    - TanakhSet
    - ClockworkSet
    maxSelectedSets: 1

- type: selectableSet
  id: BibleSet
  # Arcane-Edit-Start
  name: arcane-chaplain-set-bible-name
  description: arcane-chaplain-set-bible-description
  # Arcane-Edit-End
  sprite:
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  content:
  - Bible

- type: selectableSet
  id: QuaranSet
  # Arcane-Edit-Start
  name: arcane-chaplain-set-quaran-name
  description: arcane-chaplain-set-quaran-description
  # Arcane-Edit-End
  sprite:
    sprite: _Goobstation/Objects/Specific/Chapel/allah.rsi
    state: icon
  content:
  - BibleQuaran

- type: selectableSet
  id: TanakhSet
  # Arcane-Edit-Start
  name: arcane-chaplain-set-tanakh-name
  description: arcane-chaplain-set-tanakh-description
  # Arcane-Edit-End
  sprite:
    sprite: _Goobstation/Wizard/Objects/scroll.rsi
    state: scroll2
  content:
  - BibleTanakh

- type: selectableSet
  id: ClockworkSet
  # Arcane-Edit-Start
  name: arcane-chaplain-set-clockwork-name
  description: arcane-chaplain-set-clockwork-description
  # Arcane-Edit-End
  sprite:
    sprite: _ShitChap/Objects/clockwork_slab.rsi
    state: icon
  content:
  - BibleSlabClockwork

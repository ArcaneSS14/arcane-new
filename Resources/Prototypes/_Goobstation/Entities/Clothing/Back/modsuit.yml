- type: entity
  parent: [ClothingModsuitStandardNoStorage, ContentsExplosionResistanceBase]
  id: ClothingModsuitStandard
  components:
  - type: Storage
    grid:
    - 0,0,1,3
    - 3,0,6,3
    - 8,0,9,3
    maxItemSize: Huge

- type: entity
  abstract: true
  parent: Clothing
  id: ClothingModsuitStandardNoStorage
  name: standard modsuit control unit
  description: A special modular suit contol unit containing all necessary modular hardsuit parts.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Goobstation/Clothing/Back/Modsuits/standard.rsi
    layers:
    - state: control
  - type: Item
    size: Ginormous
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      mod-core: !type:ContainerSlot # Arcane
      mod-parts: !type:Container # Arcane
        ents: []
      mod-modules: !type:Container # Arcane
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.ModSuitUiKey.Key: # Arcane
        type: ModSuitBoundUserInterface
      enum.ChameleonUiKey.Key: # Arcane
        type: ChameleonBoundUserInterface
  - type: UseDelay
    delay: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: ModSuit # Arcane: migration to modular controls
    theme: ModThemeStandard
    parts:
      head: ClothingModsuitHelmetStandard
      gloves: ClothingModsuitGauntletsStandard
      outerClothing: ClothingModsuitChestplateStandard
      shoes: ClothingModsuitBootsStandard
  - type: WiresPanel
  - type: ItemSlots
    slots:
      mod-core: # Arcane
        name: modsuit-core-slot-name
        whitelist:
          components:
          - ModCore
  - type: ItemSlotsRequirePanel
    slots:
      mod-core: true # Arcane
  - type: ContainerFill # Arcane
    containers:
      mod-core:
      - ModsuitCoreStandard
  - type: DoAfter
  - type: Construction
    graph: Modsuit
    node: standard
  - type: ClothingSpeedModifier
    sprintModifier: 0.95
    walkModifier: 0.95
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-sealed

- type: entity
  abstract: true
  id: BaseModsuitBattery
  suffix: High-Capacity Battery

- type: entity
  parent: [ ClothingModsuitStandard, BaseModsuitBattery ]
  id: ClothingModsuitStandardPowerCell
  components:
  - type: ContainerFill # Arcane
    containers:
      mod-core:
      - ModsuitCoreStandardHighCapacity


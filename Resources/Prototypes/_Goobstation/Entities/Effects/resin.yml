- type: entity
  parent: BaseFoam
  id: Resin
  name: resin
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    color: "#ffffffcc"
    sprite: Effects/foam.rsi
    # Arcane-Edit-Start
    layers:
    - state: resin
      map: ["enum.FoamVisualLayers.Base"]
  - type: IconSmooth
    key: foam
    states:
    - !type:EdgeSpriteSmoothing
      mask: [ foam ]
      base: resin-
    # Arcane-Edit-End
  - type: FoamVisuals
    animationTime: 0.6
    animationState: resin-dissolve
  - type: AtmosResinDespawn

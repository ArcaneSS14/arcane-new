- type: entity
  id: DarkPurpleSlimeExtract
  parent: BaseSlimeExtract
  name: dark purple slime extract
  components:
  - type: Sprite
    layers:
    - sprite: _Goobstation/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#8e0ff0"
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReaction
      # Arcane-Edit-Start
      - !type:SpawnExtractStack
        stack: Plastic
        amount: 30
      # Arcane-Edit-End
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReaction
      # Arcane-Edit-Start
      - !type:SpawnExtractStack
        stack: Plasma
        amount: 3
      # Arcane-Edit-End
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractFail
  - type: Tag
    tags:
    - XenobiologyDarkPurpleExtract

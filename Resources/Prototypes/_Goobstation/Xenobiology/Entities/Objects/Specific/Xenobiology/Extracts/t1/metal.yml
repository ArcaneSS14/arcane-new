- type: entity
  id: MetalSlimeExtract
  parent: BaseSlimeExtract
  name: metal slime extract
  components:
  - type: Sprite
    layers:
    - sprite: _Goobstation/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#595959"
      shader: XenoMetallic
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReaction
      - !type:SpawnEntity
        entity: SheetGlass15
      # Arcane-Edit-Start
      - !type:SpawnExtractStack
        stack: ReinforcedGlass
        amount: 5
      # Arcane-Edit-End
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReaction
      - !type:SpawnEntity
        entity: SheetSteel15
      # Arcane-Edit-Start
      - !type:SpawnExtractStack
        stack: Plasteel
        amount: 5
      # Arcane-Edit-End
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractFail
  - type: Tag
    tags:
    - XenobiologyMetalExtract

- type: entity
  parent: [MobObserverBase, InventoryBase]
  id: AdminObserver
  name: admin observer
  categories: [ HideSpawnMenu ]
  components:
  # <Trauma>
  - type: SupermatterImmune
  - type: Speech
    speechVerb: HolierThanThou
  - type: Eye
    visMask:
      - Ghost
      - Normal
      - CosmicCultMonument
      - Abductor
  - type: Emagged # so cargo orders aren't announced and can bypass alert levels
    emagType: All
  # </Trauma>
  - type: ContentEye
    maxZoom: 8.916104, 8.916104
  - type: Tag
    tags:
    - InstantDoAfters
    - CanPilot
    - BypassInteractionRangeChecks
    - BypassDropChecks
    - BypassOpenStorageLimit
    - NoConsoleSound
    - SilentStorageUser
    - PreventAccessLogging
    - AllowBiomeLoading
    - NotGhostnadoWarpable
    - AllowPortalTraversal
    - PreventPortalCollision
  - type: Input
    context: "aghost"
  - type: Ghost
    canInteract: true
  - type: GhostHearing
  - type: Hands
    startingHands:
      hand_right:
        location: Right
      hand_left:
        location: Left
  - type: ComplexInteraction
  - type: Puller
    needsHands: false
  - type: CombatMode
  - type: Physics
    bodyType: Kinematic # Admin ghosts should ignore the laws of physics.
    ignorePaused: true
  - type: Access
    groups:
    - AllAccess
    - Silicon
    tags:
    - NuclearOperative
    - SyndicateAgent
    - CentralCommand
  - type: UserInterface
    interfaces:
      enum.SolarControlConsoleUiKey.Key:
        type: SolarControlConsoleBoundUserInterface
      enum.CommunicationsConsoleUiKey.Key:
        type: CommunicationsConsoleBoundUserInterface
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
      enum.CargoConsoleUiKey.Orders:
        type: CargoOrderConsoleBoundUserInterface
      enum.CrewMonitoringUIKey.Key:
        type: CrewMonitoringBoundUserInterface
      enum.GeneralStationRecordConsoleKey.Key:
      # who the fuck named this bruh
        type: GeneralStationRecordConsoleBoundUserInterface
  - type: IntrinsicUI
    uis:
      enum.SolarControlConsoleUiKey.Key:
        toggleAction: ActionAGhostShowSolar
      enum.CommunicationsConsoleUiKey.Key:
        toggleAction: ActionAGhostShowCommunications
      enum.RadarConsoleUiKey.Key:
        toggleAction: ActionAGhostShowRadar
      enum.CargoConsoleUiKey.Orders:
        toggleAction: ActionAGhostShowCargo
      enum.CrewMonitoringUIKey.Key:
        toggleAction: ActionAGhostShowCrewMonitoring
      enum.GeneralStationRecordConsoleKey.Key:
        toggleAction: ActionAGhostShowStationRecords
  - type: SolarControlConsole # look ma i AM the computer!
  - type: CommunicationsConsole
    title: comms-console-announcement-title-centcom
    color: "#1d8bad"
    delay: 10
    initialDelay: 0
    global: true
  - type: RadarConsole
    followEntity: true
  - type: CargoOrderConsole
  - type: CrewMonitoringConsole
  - type: GeneralStationRecordConsole
    canDeleteEntries: true
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CrewMonitor
    transmitFrequencyId: ShuttleTimer
  - type: WirelessNetworkConnection
    range: 500
  - type: StationLimitedNetwork
  - type: Thieving
    stripTimeReduction: 9999
    stealthy: true
  - type: Stripping
  - type: SolutionScanner
  - type: IgnoreUIRange
  - type: ShowAntagIcons
  - type: ShowContrabandDetails
  - type: Inventory
    templateId: aghost
  - type: Loadout
    prototypes: [ MobAghostGear ]
  - type: BypassInteractionChecks
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: GluedImmune
  - type: LubedImmune
  - type: ShowNewPlayerIcon

- type: entity
  abstract: true
  parent: BaseAction
  id: BaseAGhostAction
  components:
  - type: Action
    keywords: [ "AI", "console", "interface" ]
    priority: -10
  - type: Sprite
    sprite: Structures/Machines/parts.rsi
    layers:
    - state: box_0
      map: ["enum.ActionVisuals.Icon"]
    - state: box_2
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false

- type: entity
  parent: BaseAGhostAction
  id: ActionAGhostShowSolar
  name: Solar Control Interface
  description: View a Solar Control Interface.
  components:
  # Arcane-Edit-Start
  - type: Sprite
    sprite: _Arcane/Interface/Actions/consoles.rsi
    layers:
    - state: solar
      map: ["enum.ActionVisuals.Icon"]
    - state: solar
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  # Arcane-Edit-End
  - type: InstantAction
    event: !type:ToggleIntrinsicUIEvent { key: enum.SolarControlConsoleUiKey.Key }


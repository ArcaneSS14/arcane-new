- type: entity
  id: TegCenter
  name: thermo-electric generator
  description: A high efficiency generator that uses energy transfer between hot and cold gases to produce electricity.
  parent: [ BaseMachinePowered, BaseMachineDestructible, ConstructibleMachine ] # Arcane-Edit: Leave a destroyed frame on destruction.
  placement:
    mode: SnapgridCenter
  components:
    - type: Transform
      noRot: false
    - type: Sprite
      sprite: Structures/Power/Generation/teg.rsi
      # Arcane-Edit-Start: Select casing, panel and output states.
      layers:
        - state: teg-unassembled
          map: [ "base" ]
        - state: teg-panel
          visible: false
          map: [ "panel" ]
        - state: teg-op1
          shader: unshaded
          visible: false
          map: [ "enum.TegVisualLayers.PowerOutput" ]
      # Arcane-Edit-End
    - type: GenericVisualizer
      visuals:
        # Arcane-Edit-Start: Show the maintenance panel.
        enum.WiresVisuals.MaintenancePanelState:
          panel:
            True: { visible: true }
            False: { visible: false }
        # Arcane-Edit-End
        # Arcane-Start
        enum.TegVisuals.MachineState:
          base:
            Unassembled: { state: teg-unassembled }
            Assembled: { state: teg-assembled }
            Broken: { state: teg-broken }
          panel:
            Broken: { visible: false }
        # Arcane-End
        enum.TegVisuals.PowerOutput:
          enum.TegVisualLayers.PowerOutput:
            0: { visible: false }
            1: { visible: true, state: teg-op1 }
            2: { visible: true, state: teg-op2 }
            3: { visible: true, state: teg-op3 }
            4: { visible: true, state: teg-op4 }
            5: { visible: true, state: teg-op5 }
            6: { visible: true, state: teg-op6 }
            7: { visible: true, state: teg-op7 }
            8: { visible: true, state: teg-op8 }
            9: { visible: true, state: teg-op9 }
            10: { visible: true, state: teg-op10 }
            11: { visible: true, state: teg-op11 }

    - type: Anchorable
    - type: Pullable
    - type: NodeContainer
      examinable: true
      nodes:
        output:
          !type:CableDeviceNode
          nodeGroupID: HVPower
        teg:
          !type:TegNodeGenerator
          nodeGroupID: Teg
    - type: PowerMonitoringDevice
      group: Generator
      loadNode: output
      sprite: Structures/Power/Generation/teg.rsi
      state: teg-assembled # Arcane-Edit: static > teg-assembled
    - type: Rotatable

    # Note that only the TEG center is an AtmosDevice.
    # It fires processing on behalf of its connected circulators.
    - type: AtmosDevice
    - type: TegGenerator
      thermalEfficiency: 0.1
      powerFactor: 2

    - type: DeviceNetwork
      deviceNetId: AtmosDevices
      receiveFrequencyId: AtmosMonitor
      transmitFrequencyId: AtmosMonitor
      prefix: device-address-prefix-teg
      sendBroadcastAttemptEvent: true
      examinableAddress: true
    - type: WiredNetworkConnection

    - type: PowerSupplier
      # Have practically irrelevant supply ramping.
      # Ramping is effectively implemented by the TEG manually,
      # due to how power output is handled.
      supplyRampRate: 100000000
      supplyRampTolerance: 10000000000

    - type: Appearance
    - type: ApcPowerReceiver
      powerLoad: 1000

    - type: LitOnPowered
    - type: PointLight
      enabled: false
      castShadows: false
      radius: 1.5
      color: "#FF8800" # Arcane-Edit: #FFAA00 > #FF8800

    - type: AmbientSound
      volume: -4
      range: 6
      enabled: false
      sound:
        path: /Audio/Ambience/Objects/vending_machine_hum.ogg
    - type: GuideHelp
      guides:
      - TEG
      - Power
    - type: StealTarget
      stealGroup: Teg

    # Arcane-Start
    - type: WiresPanel
    - type: Repairable
      doAfterDelay: 5
      damageValue: -25
    - type: Machine
      board: TegGeneratorMachineCircuitboard
    - type: Destructible
      thresholds:
      - trigger: !type:DamageTrigger
          damage: 100
        behaviors:
        - !type:DoActsBehavior
          acts: ["Breakage"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalCrunch
            params:
              variation: 0.2
      - trigger: !type:DamageTrigger
          damage: 175
        behaviors:
        - !type:EmptyAllContainersBehaviour
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
            params:
              variation: 0.1
    # Arcane-End

- type: entity
  id: TegCirculator
  name: circulator
  description: Passes gas through the thermo-electric generator to exchange heat. Has an inlet and outlet port.
  parent: [ BaseMachine, BaseMachineDestructible, ConstructibleMachine ] # Arcane-Edit: Leave a destroyed frame on destruction.
  placement:
    mode: SnapgridCenter
  components:
    - type: Transform
      noRot: false

    # visuals
    - type: Sprite
      sprite: Structures/Power/Generation/teg.rsi
      # Arcane-Edit-Start: Separate casing, panel and loop effects.
      layers:
        - state: circ-unassembled-0
          map: [ "enum.TegVisualLayers.CirculatorBase" ]
        - state: circ-off
          shader: unshaded
          visible: false
          map: [ "heat" ]
        - state: circ-slow
          shader: unshaded
          visible: false
          map: [ "enum.TegVisualLayers.CirculatorLight" ]
        - state: circ-panel
          visible: false
          map: [ "panel" ]
      # Arcane-Edit-End
    - type: GenericVisualizer
      # Arcane-Edit-Start: Display machine and loop state.
      visuals:
        enum.WiresVisuals.MaintenancePanelState:
          panel:
            True: { visible: true }
            False: { visible: false }
        enum.TegVisuals.MachineState:
          enum.TegVisualLayers.CirculatorBase:
            Unassembled: { state: circ-unassembled-0 }
            UnassembledFlipped: { state: circ-unassembled-1 }
            Assembled: { state: circ-assembled-0 }
            AssembledFlipped: { state: circ-assembled-1 }
            Broken: { state: circ-broken }
          panel:
            Broken: { visible: false }
        enum.TegVisuals.CirculatorState:
          heat:
            Off: { visible: false }
            Idle: { visible: true, state: circ-off }
            HotSlow: { visible: true, state: circ-hot }
            HotFast: { visible: true, state: circ-exhot }
            ColdSlow: { visible: true, state: circ-cold }
            ColdFast: { visible: true, state: circ-excold }
          enum.TegVisualLayers.CirculatorLight:
            Off: { visible: false }
            Idle: { visible: false }
            HotSlow: { visible: true, state: circ-slow }
            HotFast: { visible: true, state: circ-run }
            ColdSlow: { visible: true, state: circ-slow }
            ColdFast: { visible: true, state: circ-run }
      # Arcane-Edit-End

    - type: Appearance
    - type: PointLight
      enabled: false
      castShadows: false
      radius: 1 # Arcane-Edit: 1.5 > 1
      color: "#FFFFFF" # Arcane-Edit: #CC00FF > #FFFFFF

    # tags
    - type: Tag
      tags:
        - Unstackable

    # basic interactions
    - type: Rotatable
    - type: Anchorable
    - type: Pullable
    - type: GuideHelp
      guides:
      - TEG
      - Power

    # functionality
    - type: NodeContainer
      nodes:
        inlet:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: North
          volume: 100
        outlet:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: South
          volume: 100
        circulator:
          !type:TegNodeCirculator
          nodeGroupID: Teg

    - type: AtmosUnsafeUnanchor
      destroyOnBreak: false # Arcane
    - type: PipeRestrictOverlap
    - type: TegCirculator
    - type: StealTarget
      stealGroup: Teg
    - type: DirectionalArrowIndicator
      flipOnAppearance: enum.TegVisuals.Flipped # Arcane
      arrows:
      - offset: 0, -1.5
        arrowType: BlueDirectionalArrowIndicator
      - offset: 0, 0
        arrowType: BlueDirectionalArrowIndicator
    # Arcane-Start
    - type: WiresPanel
    - type: Repairable
      doAfterDelay: 5
      damageValue: -25
    - type: Machine
      board: TegCirculatorMachineCircuitboard
    - type: Destructible
      thresholds:
      - trigger: !type:DamageTrigger
          damage: 100
        behaviors:
        - !type:DoActsBehavior
          acts: ["Breakage"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalCrunch
            params:
              variation: 0.2
      - trigger: !type:DamageTrigger
          damage: 175
        behaviors:
        - !type:EmptyAllContainersBehaviour
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
            params:
              variation: 0.1
    - type: PipeAppearance
      exposedConnections: true
      sprite:
      - { sprite: Structures/Power/Generation/teg.rsi, state: cap }
    # Arcane-End

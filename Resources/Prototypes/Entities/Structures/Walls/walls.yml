- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseStructureWall
  name: basewall
  description: Keeps the air in and the greytide out.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  # <Trauma>
  - type: Penetratable
    penetrateDamage: 50
    damagePenalty: 0.1
  - type: ExaminableDamage
    messages: WindowMessages
  - type: SoundBlocker
  # </Trauma>
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MetalBulletImpact
    soundTypes:
      Heat:
        collection:
          MetalLaserImpact
  - type: Wall
  - type: IsRoof
  - type: Sprite
    drawdepth: Walls
  - type: Icon
    state: full
  - type: PlacementReplacement
    key: walls
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Airtight
  - type: StaticPrice
    price: 75
  - type: RadiationBlocker
    resistance: 1 # Arcane-Edit: 2 > 1
  - type: BlockWeather
  - type: SunShadowCast

- type: entity
  abstract: true
  parent: BaseStructureWall
  id: BaseWall
  components:
    # <Trauma>
  - type: FreezableWall
  - type: Appearance
  - type: BulletHole
    # </Trauma>
  - type: Occluder # Breaks on diagonal walls
  - type: PlacementReplacement
    key: walls
  - type: StructureAlignerPylon
    pylons:
    - Door
    - Firelock

- type: entity
  abstract: true
  parent: BaseStructureWall
  id: WallDiagonalBase
  suffix: Diagonal
  components:
  - type: Tag
    tags:
    - Diagonal
  - type: IconSmooth
    key: walls
    # Arcane-Edit-Start
    states:
    - !type:DiagonalSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: state
    # Arcane-Edit-End
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: Occluder
    polygon:
    - "-0.5,-0.5"
    - "0.5,0.5"
    - "0.5,-0.5"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
          vertices:
          - "-0.5,-0.5"
          - "0.5,0.5"
          - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer

- type: entity
  parent: [ BaseWall, StructureHealthWallWeak ]
  id: WallBrick
  name: brick wall
  components:
  # <Trauma>
  - type: CosmicCorruptible
    convertTo: WallCosmicCult
  # </Trauma>
  - type: Sprite
    sprite: Structures/Walls/brick.rsi
  - type: Icon
    sprite: Structures/Walls/brick.rsi
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger: &DamageWallWeak
        !type:DamageTrigger
        damage: 150
      behaviors:
      - &SoundBreakStone !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
      - &SpawnGirder !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          Girder:
            min: 1
            max: 1
  - type: IconSmooth
    key: walls
    # Arcane-Edit-Start
    states:
    - !type:CornerSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: brick
    # Arcane-Edit-End

- type: entity
  parent: [ BaseWall, StructureHealthWallWeak ]
  id: WallBrass
  name: brass wall
  components:
  # <Trauma>
  - type: CosmicCorruptible
    convertTo: WallCosmicCult
  # </Trauma>
  - type: Sprite
    sprite: Structures/Walls/brass.rsi
  - type: Icon
    sprite: Structures/Walls/brass.rsi
  - type: Construction
    graph: Girder
    node: brassWall
  - type: Damageable
    damageModifierSet: BrassMod
  - type: Destructible
    thresholds:
    - trigger: *DamageWallWeak
      behaviors:
      - &SoundMetalSlam !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
          params:
            volume: -4
      - &ChangeNodeGirder !type:ChangeConstructionNodeBehavior
        node: girder
  - type: IconSmooth
    key: walls
    # Arcane-Edit-Start
    states:
    - !type:CornerSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: brass
    # Arcane-Edit-End

- type: entity
  parent: [ BaseWall, StructureHealthWallWeak ]
  id: WallMeat
  name: meat wall
  description: Sticky.
  components:
  - type: Tag
    tags:
    - Structure
  - type: Sprite
    sprite: Structures/Walls/meat.rsi
  - type: Icon
    sprite: Structures/Walls/meat.rsi
  - type: Construction
    graph: Girder
    node: meatWall
  - type: Injurable
    damageContainer: StructuralBiological
  - type: Destructible
    thresholds:
    - trigger: *DamageWallWeak
      behaviors:
      - *ChangeNodeGirder
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialSheetMeat1: &BaseWallSpawn
            min: 0
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: gib
  - type: IconSmooth
    # Arcane-Edit-Start
    key: walls
    states:
    - !type:CornerSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: meat

- type: entity
  parent: [ BaseWall, StructureHealthWallStrong ]
  id: WallReinforced
  name: reinforced wall
  components:
  # <Trauma>
  - type: RustRequiresPathStage
    pathStage: 7 # Toxic blade
  - type: Penetratable
    penetrateDamage: 100
    damagePenalty: 0.25
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Iron
        Quantity: 33
      - ReagentId: Carbon
        Quantity: 7
  - type: CosmicCorruptible
    convertTo: WallCosmicCult
  # </Trauma>
  - type: Sprite
    sprite: Structures/Walls/solid-reinforced.rsi # Arcane-Edit: sprite: Structures/Walls/solid.rsi > sprite: Structures/Walls/solid-reinforced.rsi
  - type: Icon
    sprite: Structures/Walls/solid-reinforced.rsi # Arcane-Edit: sprite: Structures/Walls/solid.rsi > sprite: Structures/Walls/solid-reinforced.rsi
    state: full # Arcane-Edit: state: rgeneric > state: full
  - type: Construction
    graph: Girder
    node: reinforcedWall
  - type: Damageable
    damageModifierSet: PlasteelStaticMod
  - type: Destructible
    thresholds:
    - trigger: *DamageWallStrong
      behaviors:
      - &ChangeNodeReinforcedGirder !type:ChangeConstructionNodeBehavior
        node: reinforcedGirder
      - *SoundMetalSlam
      - &SpawnPlasteel !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1: *BaseWallSpawn
  - type: IconSmooth
    key: walls
    # Arcane-Edit-Start
    states:
    - !type:CardinalCornerSpriteSmoothing
      mask: [ walls ]
      altMask:
      - windows
      - windows-reinf
      - windows-tinted
      - windows-plasma
      - windows-plasma-reinf
      - windows-uranium
      - windows-uranium-reinf
      - windows-exo
      - windows-shuttle
      - windows-plastitanium
      - windows-regal
      - walls-exo
      - walls-shuttle
      - walls-plastitanium
      - walls-material
      - marble
      - walls
      - grilles
      - doors
      base: wall
    # Arcane-Edit-End
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ReinforcedWallVisuals.DeconstructionStage:
        ReinforcedWallVisualLayers.Deconstruction:
          -1: { visible: false }
          0: { state: reinf_construct-0, visible: true}
          1: { state: reinf_construct-1, visible: true}
          2: { state: reinf_construct-2, visible: true}
          3: { state: reinf_construct-3, visible: true}
          4: { state: reinf_construct-4, visible: true}
          5: { state: reinf_construct-5, visible: true}
  - type: ReinforcedWallReplacementMarker
  - type: StaticPrice
    price: 250
  - type: RadiationBlocker
    resistance: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000


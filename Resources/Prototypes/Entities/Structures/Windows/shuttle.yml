- type: entity
  parent: [BaseDeltaPressureReinforcedGlass, BaseWindowStructure, BaseRCDResistant, StructureHealthBarrierStrong]
  id: ShuttleWindow
  name: shuttle window
  components:
  - type: Sprite
    sprite: _Arcane/Structures/Windows/window-shuttle.rsi # Arcane-Edit: sprite: Structures/Windows/window-shuttle.rsi > sprite: _Arcane/Structures/Windows/window-shuttle.rsi
  - type: Icon
    sprite: _Arcane/Structures/Windows/window-shuttle.rsi # Arcane-Edit: sprite: Structures/Windows/window-shuttle.rsi > sprite: _Arcane/Structures/Windows/window-shuttle.rsi
    state: full
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 3
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
          PartRodMetal:
            min: 1
            max: 2
  - type: IconSmooth
    # Arcane-Edit-Start
    key: windows-shuttle
    states:
    - !type:CardinalCornerSpriteSmoothing
      mask: [ windows-shuttle ]
      altMask:
      - windows
      - windows-reinf
      - windows-tinted
      - windows-plasma
      - windows-plasma-reinf
      - windows-uranium
      - windows-uranium-reinf
      - windows-exo
      - windows-plastitanium
      - windows-regal
      - walls-exo
      - walls-shuttle
      - walls-plastitanium
      - walls-material
      - walls-marble
      - walls
      - grilles
      - doors
      base: window
    # Arcane-Edit-End
  - type: Construction
    graph: Window
    node: shuttleWindow
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 20
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: StaticPrice
    price: 150
  - type: CosmicCorruptible # DeltaV - Cosmic Cult
    convertTo: WindowCosmicCult

- type: entity
  parent: ShuttleWindow
  id: ShuttleWindowDiagonal
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
    # Arcane-Edit-Start
    sprite: _Arcane/Structures/Windows/window-diagonal-shuttle.rsi
    # Arcane-Edit-End
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
    # Arcane-Edit-Start
    states:
    - !type:DiagonalSpriteSmoothing
      mask:
      - walls
      - windows
      - grilles
      - marble
      - doors
      base: state
    # Arcane-Edit-End
  - type: Icon
    sprite: _Arcane/Structures/Windows/window-diagonal-shuttle.rsi # Arcane-Edit: sprite: Structures/Windows/window-diagonal-shuttle.rsi > sprite: _Arcane/Structures/Windows/window-diagonal-shuttle.rsi
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks-diagonal.rsi

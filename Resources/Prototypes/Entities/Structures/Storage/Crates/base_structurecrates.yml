    - Structures/Storage/Crates/medicalcrate_secure.rsi
    - Structures/Storage/Crates/o2.rsi
    - Structures/Storage/Crates/plasma.rsi
    - Structures/Storage/Crates/privatecrate_secure.rsi
    - Structures/Storage/Crates/radiation.rsi
    - Structures/Storage/Crates/scicrate_secure.rsi
    - Structures/Storage/Crates/science.rsi
    - Structures/Storage/Crates/sec_gear.rsi
    - Structures/Storage/Crates/secure.rsi
    - Structures/Storage/Crates/surgery.rsi
    - Structures/Storage/Crates/syndicate.rsi
    - Structures/Storage/Crates/syndicate_secure.rsi
    - Structures/Storage/Crates/weapon.rsi
    - Structures/Storage/Crates/piratechest.rsi
    - Structures/Storage/Crates/toybox.rsi
    - Structures/Storage/Crates/web.rsi
    - Structures/Storage/Crates/trashcart.rsi
    - Structures/Storage/Crates/lockbox.rsi
    - _Goobstation/Objects/Storage/binglecrate.rsi
    - _Lavaland/Structures/Storage/Crates/necropolechest.rsi
    - _Arcane/Structures/Storage/Crates/animal-rights-consortium_secure.rsi
    - _Arcane/Structures/Storage/Crates/atmos.rsi
    - _Arcane/Structures/Storage/Crates/atmos_secure.rsi
    - _Arcane/Structures/Storage/Crates/bitrun_secure.rsi
    - _Arcane/Structures/Storage/Crates/cargo.rsi
    - _Arcane/Structures/Storage/Crates/cargo_secure.rsi
    - _Arcane/Structures/Storage/Crates/cybersun-dawn_secure.rsi
    - _Arcane/Structures/Storage/Crates/cybersun-dusk_secure.rsi
    - _Arcane/Structures/Storage/Crates/cybersun-noon_secure.rsi
    - _Arcane/Structures/Storage/Crates/deforest.rsi
    - _Arcane/Structures/Storage/Crates/donk.rsi
    - _Arcane/Structures/Storage/Crates/donk_secure.rsi
    - _Arcane/Structures/Storage/Crates/gold.rsi
    - _Arcane/Structures/Storage/Crates/gorlex-weapon_secure.rsi
    - _Arcane/Structures/Storage/Crates/gorlex_secure.rsi
    - _Arcane/Structures/Storage/Crates/inteq.rsi
    - _Arcane/Structures/Storage/Crates/inteq_secure.rsi
    - _Arcane/Structures/Storage/Crates/interdyne-freezer_secure.rsi
    - _Arcane/Structures/Storage/Crates/interdyne_secure.rsi
    - _Arcane/Structures/Storage/Crates/kitchen.rsi
    - _Arcane/Structures/Storage/Crates/kitchen_secure.rsi

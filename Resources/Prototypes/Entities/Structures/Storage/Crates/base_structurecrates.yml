- type: entity
  abstract: true
  parent: [ BaseStructureDynamic, BasePaperLabelableVisualized ]
  id: BaseCrate
  name: crate
  description: A large container for items.
  components:
  # Arcane-Start: Animate only the separate lids of supported crates.
  - type: StorageAnimationVisuals
    sprites:

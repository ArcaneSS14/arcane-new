    - Structures/Storage/Crates/command.rsi
    - Structures/Storage/Crates/electrical.rsi
    - Structures/Storage/Crates/engicrate_secure.rsi
    - Structures/Storage/Crates/engineering.rsi
    - Structures/Storage/Crates/freezer.rsi

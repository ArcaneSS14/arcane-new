- type: entity
  abstract: true
  parent: BaseStructure
  id: TableBase
  name: table
  description: A square piece of metal standing on four metal legs.
  components:
  - type: Animateable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: PlaceableSurface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask: # tables should collide with other tables
        - TableMask
        layer:
        - TableLayer
  - type: SpriteFade
  - type: Sprite
  - type: Icon
    state: full
  - type: IconSmooth
    # Arcane-Edit-Start
    key: table
    states:
    - !type:CornerSpriteSmoothing
      mask: [ table ]
      base: state_
    # Arcane-Edit-End
  - type: Climbable
  - type: Bonkable
    bonkDamage:
      types:
        Blunt: 4
  - type: Clickable
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHull
  - type: Tag
    tags:
    - ForceFixRotations

- type: entity
  abstract: true
  parent: TableBase
  id: CounterBase
  name: counter
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - TableMask
        layer:
        - BulletImpassable # Trauma
        - TableLayer
        - LowImpassable
  # Arcane-Start
  - type: IconSmooth
    key: counter
    states:
    - !type:CornerSpriteSmoothing
      mask: [ counter ]
      base: state_
  # Arcane-End

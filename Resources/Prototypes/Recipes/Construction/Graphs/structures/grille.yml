- type: constructionGraph
  id: Grille
  start: start
  graph:
    - node: start
      edges:
        - to: grille
          completed:
            - !type:AdminLog # Needs a log for start of attempt in addition to the completion log
              message: "Construction"
              impact: High
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: MetalRod
              amount: 2
              doAfter: 1
        # Arcane-Start
        - to: clockGrille
          completed:
          - !type:AdminLog
            message: "Construction"
            impact: High
          - !type:SnapToGrid
            southRotation: true
          steps:
          - material: MetalRod
            amount: 2
            doAfter: 1
        # Arcane-End

    - node: grille
      entity: Grille
      edges:
        - to: start
          completed:
            - !type:AdminLog # Needs a log for start of attempt in addition to the completion log
              message: "A grille was cut"
            - !type:SpawnPrototype
              prototype: PartRodMetal1
              amount: 2
            - !type:DeleteEntity
          steps:
            - tool: Cutting
              doAfter: 0.25

        # Arcane-Start: windows can be built directly on a grille
        - to: window
          steps:
            - material: Glass
              amount: 2
              doAfter: 3

        - to: reinforcedWindow
          steps:
            - material: ReinforcedGlass
              amount: 2
              doAfter: 2

        - to: uraniumWindow
          steps:
            - material: UraniumGlass
              amount: 2
              doAfter: 2

        - to: reinforcedUraniumWindow
          steps:
            - material: ReinforcedUraniumGlass
              amount: 2
              doAfter: 3

        - to: plasmaWindow
          steps:
            - material: PlasmaGlass
              amount: 2
              doAfter: 2

        - to: reinforcedPlasmaWindow
          steps:
            - material: ReinforcedPlasmaGlass
              amount: 2
              doAfter: 3

        - to: shuttleWindow
          steps:
            - material: Plasteel
              amount: 2
            - material: ReinforcedGlass
              amount: 2
              doAfter: 4

        - to: clockworkWindow
          steps:
            - material: ClockworkGlass
              amount: 2
              doAfter: 3
        # Arcane-End

    - node: grilleBroken
      entity: GrilleBroken
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: PartRodMetal1
              amount: 1
            - !type:DeleteEntity
          steps:
            - tool: Cutting
        - to: grille
          steps:
            - material: MetalRod
              amount: 1
              doAfter: 0.5

    # Arcane-Start
    - node: clockGrille
      entity: ClockworkGrille
      edges:
      - to: start
        completed:
        - !type:AdminLog
          message: "A grille was cut"
        - !type:SpawnPrototype
          prototype: PartRodMetal1
          amount: 2
        - !type:DeleteEntity {}
        steps:
        - tool: Cutting
          doAfter: 0.25
      - to: clockGrilleBroken
        steps:
        - tool: Cutting
          doAfter: 0.25

    - node: clockGrilleBroken
      entity: ClockworkGrilleBroken
      edges:
      - to: start
        completed:
        - !type:SpawnPrototype
          prototype: PartRodMetal1
          amount: 1
        - !type:DeleteEntity {}
        steps:
        - tool: Cutting
      - to: clockGrille
        steps:
        - material: MetalRod
          amount: 1
          doAfter: 0.5
    # Arcane-End

    # Arcane-Start
    - node: window
      entity: Window
      keepOriginalEntity: true
      actions:
      - !type:SnapToGrid {}

    - node: reinforcedWindow
      entity: ReinforcedWindow
      keepOriginalEntity: true
      actions:
      - !type:SnapToGrid {}

    - node: uraniumWindow
      entity: UraniumWindow
      keepOriginalEntity: true
      actions:
      - !type:SnapToGrid {}

    - node: reinforcedUraniumWindow
      entity: ReinforcedUraniumWindow
      keepOriginalEntity: true
      actions:
      - !type:SnapToGrid {}

    - node: plasmaWindow
      entity: PlasmaWindow
      keepOriginalEntity: true
      actions:
      - !type:SnapToGrid {}

    - node: reinforcedPlasmaWindow
      entity: ReinforcedPlasmaWindow
      keepOriginalEntity: true
      actions:
      - !type:SnapToGrid {}

    - node: shuttleWindow
      entity: ShuttleWindow
      keepOriginalEntity: true
      actions:
      - !type:SnapToGrid {}

    - node: clockworkWindow
      entity: ClockworkWindow
      keepOriginalEntity: true
      actions:
      - !type:SnapToGrid {}
    # Arcane-End

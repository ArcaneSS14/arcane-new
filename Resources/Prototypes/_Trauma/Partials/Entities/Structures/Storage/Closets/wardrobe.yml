- type: entity
  parent: [ LockerBase, AntiTamperLowPriority ]
  id: WardrobeChapel
  name: chaplain's locker
  components:
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: chapel
    stateDoorOpen: chapel_open
    stateDoorClosed: chapel_door
  - type: AccessReader
    access: [ [ "Chapel" ] ]
  - type: Sprite
    # Arcane-Edit-Start: Orion storage sprites
    sprite: _Trauma/Structures/Storage/closet.rsi
    layers: !Clear
    - !Index:0
      state: chapel
      map: ["enum.StorageVisualLayers.Base"]
    - !Index:0
      state: chapel_door
      map: ["enum.StorageVisualLayers.Door"]
    - !Index:0
      state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - !Index:0
      state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - !Index:0
      state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      offset: "-0.065,0"
      map: ["enum.PaperLabelVisuals.Layer"]
    # Arcane-Edit-End
  # Arcane-Start: Orion storage sprites
  - type: Icon
    sprite: _Trauma/Structures/Storage/closet.rsi
    state: icon
  # Arcane-End

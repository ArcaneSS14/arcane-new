- type: entity
  parent: BaseMachineCircuitboard
  id: DeepFryerCircuitboard
  name: deep fryer machine board
  description: A machine printed circuit board for a deep fryer.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: KitchenDeepFryer
    stackRequirements:
      # Manipulator: 1 # Arcane-Edit: replaced by machine parts
      Steel: 10
      CableHV: 4
    # Arcane-Start
    partRequirements:
      Servo: 1
    # Arcane-End

- type: entity
  parent: BaseMachineCircuitboard
  id: ChemiCompilerMachineCircuitboard
  name: ChemiCompiler M7 machine board
  description: A machine printed circuit board for a ChemiCompiler M7.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: ChemiCompiler
    stackRequirements:
      # Manipulator: 2 # Arcane-Edit: replaced by machine parts
      Glass: 2
      Cable: 2
    tagRequirements:
      GlassBeaker:
        amount: 2
        defaultPrototype: Beaker
    # Arcane-Start
    partRequirements:
      Servo: 2
    # Arcane-End

- type: entity
  parent: BaseMachineCircuitboard
  id: AbductorBiofabMachineBoard
  name: abductor biofab machine board
  description: A machine printed circuit board for a abductor biofab.
  components:
  - type: MachineBoard
    prototype: AbductorBiofabricator
    # stackRequirements: # Arcane-Edit: machine parts only
      # Manipulator: 4 # Arcane-Edit: replaced by machine parts
    # Arcane-Start
    partRequirements:
      Servo: 4
    # Arcane-End

- type: constructionGraph
  id: ArcaneTilesBrass
  start: start
  graph:
  - node: start
    edges:
    - to: filledPlate
      completed:
      - !type:SetStackCount
        amount: 4
      steps:
      - material: Brass
        amount: 1
    - to: reebe
      completed:
      - !type:SetStackCount
        amount: 4
      steps:
      - material: Brass
        amount: 1
  - node: filledPlate
    entity: FloorTileItemBrassFilled
  - node: reebe
    entity: FloorTileItemBrassReebe

- type: constructionGraph
  id: TileCanvas
  start: start
  graph:
    - node: start
      edges:
        - to: canvastile
          completed:
            - !type:SetStackCount
              amount: 4
          steps:
            - material: WoodPlank
              amount: 1
            - material: Cloth
              amount: 1
    - node: canvastile
      entity: FloorTileItemCanvas

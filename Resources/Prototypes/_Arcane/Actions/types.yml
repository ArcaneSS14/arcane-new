- type: entity
  parent: BaseAction
  id: ActionToggleEnergyDome
  name: Toggle energy dome
  description: Turn the energy barrier on or off.
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -10
    useDelay: 1
  - type: Sprite
    sprite: Objects/Weapons/Melee/e_shield.rsi
    layers:
    - state: eshield-on
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  parent: BaseToggleAction
  id: ActionToggleHUDs
  name: Toggle HUDs
  description: Toggles the visibility of the HUDs.
  components:
  - type: Action
    itemIconStyle: NoItem
    priority: -1
    useDelay: 1
    checkCanInteract: false
  - type: Sprite
    sprite: Clothing/Eyes/Hud/omni.rsi
    layers:
    - state: icon

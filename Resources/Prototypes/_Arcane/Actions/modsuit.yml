- type: entity
  parent: BaseAction
  id: ActionModSuitActivate
  name: Toggle MOD activation
  description: Seal or unseal your MODsuit. All parts must be deployed first.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: true
    checkConsciousness: true
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _Goobstation/Actions/modsuit.rsi
    state: activate
  - type: InstantAction
    event: !type:ModSuitActivateActionEvent

- type: entity
  parent: BaseAction
  id: ActionModSuitDeploy
  name: Deploy MOD parts
  description: Deploy or retract every part of your MODsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: true
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ModSuitDeployActionEvent

- type: entity
  parent: BaseAction
  id: ActionModModule
  name: Use MOD module
  description: Use or toggle this MODsuit module.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ModModuleActionEvent

- type: entity
  parent: ActionModModule
  id: ActionModAdrenalineBoost
  name: Use MOD adrenaline boost
  description: Injects stimulants and helps you stand up.
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false

- type: entity
  parent: BaseAction
  id: ActionModPowerKick
  name: Power kick
  description: Launches the wearer towards a target with a powered kick.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: TargetAction
    checkCanAccess: false
    range: 7
  - type: EntityTargetAction
    canTargetSelf: false
  - type: WorldTargetAction
    event: !type:ModPowerKickActionEvent

- type: entity
  parent: BaseAction
  id: ActionModSelectDevice
  name: Select MOD device
  description: Choose which device the module will deploy.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ModSelectDeviceActionEvent

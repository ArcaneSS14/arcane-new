- type: entity
  parent: BaseAction
  id: ActionArcaneTargetLock
  name: target lock
  description: Select a living creature. The next shot will be aimed at it.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: TargetAction
    range: 25
    checkCanAccess: false
    interactOnMiss: false
    repeat: false
  - type: EntityTargetAction
    event: !type:ArcaneTargetLockSelectEvent
  - type: Sprite
    sprite: _Arcane/Interface/Actions/action_sniper.rsi
    layers:
    - state: eyeclose
      map: ["enum.ActionVisuals.Icon"]
    - state: eyeopen
      map: ["enum.ActionVisuals.IconToggled"]

- type: entity
  parent: BaseAction
  id: ActionArcaneAim
  name: aim down sights
  description: Zoom and shift the camera. Moving or pressing again cancels.
  components:
  - type: Action
    itemIconStyle: BigItem
    useDelay: 0.2
  - type: InstantAction
    event: !type:ArcaneAimActionEvent
  - type: Sprite
    sprite: _Goobstation/Wizard/Effects/effects.rsi
    layers:
    - state: marker
      map: ["enum.ActionVisuals.Icon"]

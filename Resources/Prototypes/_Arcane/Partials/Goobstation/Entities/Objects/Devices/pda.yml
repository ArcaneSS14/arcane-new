- type: entity
  id: CommandMaidPDA
  description: It really lacks the camera monitor function.
  components:
  - type: Sprite
    sprite: _Arcane/Objects/Devices/pda.rsi
    layers: !Clear
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: pda_base
    - state: pda_buttons
    - state: pda_commaid
    - state: pda_screen_borders
    - state: light_overlay
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: unshaded
      visible: false
    - state: id_overlay
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: unshaded
      visible: false
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda_base
  - type: Icon
    sprite: _Arcane/Objects/Devices/pda.rsi
    state: icon
  - type: PdaBorderColor
    borderColor: "#ff96f1"
    accentVColor: "#302243"

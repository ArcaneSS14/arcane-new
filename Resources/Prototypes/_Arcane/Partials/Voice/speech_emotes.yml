- type: emote
  id: Squish
  effectsOnEmote:
  - !type:RaiseNetworkEvents
    conditions:
    - !type:WhitelistCondition
      whitelist:
        components:
        - Jiggle
    events:
    - !type:JiggleEmoteEvent
      pulses:
      - impulse: 0,-40

- type: emote
  id: Bubble
  effectsOnEmote:
  - !type:RaiseNetworkEvents
    conditions:
    - !type:WhitelistCondition
      whitelist:
        components:
        - Jiggle
    events:
    - !type:JiggleEmoteEvent
      pulses:
      - impulse: 8,10
      - delay: 0.12
        impulse: -14,-6
      - delay: 0.24
        impulse: 14,10
      - delay: 0.36
        impulse: -14,-6
      - delay: 0.48
        impulse: 8,8

- type: emote
  id: Pop
  effectsOnEmote:
  - !type:RaiseNetworkEvents
    conditions:
    - !type:WhitelistCondition
      whitelist:
        components:
        - Jiggle
    events:
    - !type:JiggleEmoteEvent
      pulses:
      - impulse: 0,45
      - delay: 0.12
        impulse: 0,-40

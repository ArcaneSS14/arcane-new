- type: entity
  id: BlessingOfTheReaper
  components:
  - type: NullrodRecallBlocked

- type: entity
  id: ArmamentsBeacon
  components:
  - type: RadialItemSelector
    entries:
    - prototype: SpawnArmamentsDraconic
      icon:
        sprite: _Arcane/Clothing/OuterClothing/Misc/dragonsuit.rsi
        state: full
    - prototype: SpawnArmamentsInquisitor
      icon:
        sprite: _Arcane/Clothing/OuterClothing/Misc/inquisitor.rsi
        state: full

- type: entity
  id: AltarConvertMaint
  components:
  - type: Construction
    containers:
    - altar_offering
  - type: ContainerContainer
    containers:
      altar_offering: !type:Container
  - type: ContainerFill
    containers:
      altar_offering:
      - ClothingHandsGlovesColorYellowBudget


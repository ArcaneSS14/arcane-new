# Orion #56/#366/#461; selected robotics locker and wardrobe: B3-1.
# Prepend cleared layers with !Index:0: partial sequence merges otherwise reverse painter order.

- type: entity
  id: ClosetBase
  components:
  - type: Sprite
    sprite: _Arcane/Structures/Storage/closet.rsi
    offset: 0, 0.25

- type: entity
  id: LockerBase
  components:
  - type: Sprite
    sprite: _Arcane/Structures/Storage/closet.rsi
    offset: 0, 0.25

- type: entity
  id: BaseWallCloset
  components:
  - type: Sprite
    sprite: _Arcane/Structures/Storage/wall_locker.rsi

- type: entity
  id: BaseWallLocker
  components:
  - type: Sprite
    sprite: _Arcane/Structures/Storage/wall_locker.rsi

- type: entity
  id: LockerNanorep
  components:
  - type: Sprite
    sprite: _Arcane/Structures/Storage/Closets/blueshield_nt.rsi
    offset: 0, 0.25

- type: entity
  id: WardrobeChapel
  components:
  - type: Icon
    sprite: _Arcane/Structures/Storage/Closets/chaplain.rsi
    state: icon
  - type: Sprite
    sprite: _Arcane/Structures/Storage/Closets/chaplain.rsi
    offset: 0, 0.25
    layers: !Clear
    - !Index:0
      state: chapel
      map: ["enum.StorageVisualLayers.Base"]
    - !Index:0
      state: chapel_door
      map: ["enum.StorageVisualLayers.Door"]
    - !Index:0
      state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - !Index:0
      state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - !Index:0
      state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      offset: "-0.065,0"
      map: ["enum.PaperLabelVisuals.Layer"]

- type: entity
  id: LockerRoboticist
  components:
  - type: Icon
    sprite: _Arcane/Structures/Storage/Closets/roboticist.rsi
    state: icon
  - type: Sprite
    sprite: _Arcane/Structures/Storage/Closets/roboticist.rsi
    layers: !Clear
    - !Index:0
      state: robo_base
      map: ["enum.StorageVisualLayers.Base"]
    - !Index:0
      state: robo_door
      map: ["enum.StorageVisualLayers.Door"]
    - !Index:0
      state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - !Index:0
      state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - !Index:0
      state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      offset: "-0.065,0"
      map: ["enum.PaperLabelVisuals.Layer"]

- type: entity
  id: WardrobeRobotics
  components:
  - type: Icon
    sprite: _Arcane/Structures/Storage/Closets/roboticist_wardrobe.rsi
    state: icon
  - type: Sprite
    sprite: _Arcane/Structures/Storage/Closets/roboticist_wardrobe.rsi
    layers: !Clear
    - !Index:0
      state: generic
      map: ["enum.StorageVisualLayers.Base"]
    - !Index:0
      state: robo_wardrobe_door
      map: ["enum.StorageVisualLayers.Door"]
    - !Index:0
      state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - !Index:0
      state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: EntityStorageVisuals
    stateBaseClosed: generic
    stateDoorOpen: generic_open
    stateDoorClosed: robo_wardrobe_door


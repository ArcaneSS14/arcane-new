- type: entity
  id: Medkit
  components:
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Arcane/Items/Storage/medkit_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Arcane/Items/Storage/medkit_drop.ogg
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Arcane/Items/Storage/medkit_pick_up.ogg
  - type: Storage
    storageInsertSound: !Clear
      path: /Audio/_Arcane/Items/Storage/medkit_rustle.ogg
    storageOpenSound: !Clear
      path: /Audio/_Arcane/Items/Storage/medkit_open.ogg

- type: entity
  id: MedkitAdvanced
  components:
  - type: Storage
    grid:
    - !Remove 0,0,5,1
    - 0,0,6,1

- type: entity
  id: BaseBeaker
  components:
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Arcane/Items/ReagentContainers/beaker_place.ogg
      params:
        volume: -4
        variation: 0.125
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Arcane/Items/ReagentContainers/beaker_place.ogg
      params:
        volume: -4
        variation: 0.125
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Arcane/Items/ReagentContainers/beaker_pickup.ogg
      params:
        volume: -6
        variation: 0.125


- type: entity
  id: BaseBeaker
  components:
  - type: HeatTint
    solution: beaker
    colorGradient:
    - temperature: 200
      color: "#A0BCE0"
    - temperature: 293
      color: "#FFFFFF"
    - temperature: 350
      color: "#FFC0A8"
    - temperature: 800
      color: "#FF9880"
    affectedLayers:
    - "enum.SolutionContainerLayers.Fill"

- type: entity
  id: BaseChemistryVial
  components:
  - type: HeatTint
    solution: drink
    colorGradient:
    - temperature: 200
      color: "#A0BCE0"
    - temperature: 293
      color: "#FFFFFF"
    - temperature: 350
      color: "#FFC0A8"
    - temperature: 800
      color: "#FF9880"
    affectedLayers:
    - "enum.SolutionContainerLayers.Fill"

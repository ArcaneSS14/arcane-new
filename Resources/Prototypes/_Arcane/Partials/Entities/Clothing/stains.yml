# Stains on clothing: blood and other reagents soak into worn clothing and show on the sprite.
# The stain solution itself is SolutionClothingStain (_Arcane/Entities/Clothing/solutions.yml).

- type: entity
  id: ClothingBeltBase
  components:
  - type: Appearance
  - type: Stainable
    clothingVisuals:
      belt:
      - sprite: _Arcane/Effects/blood.rsi
        state: beltblood
    iconVisuals:
    - sprite: _Arcane/Effects/blood.rsi
      state: beltbloodicon
  - type: SolutionManager
    solutions:
    - SolutionClothingStain


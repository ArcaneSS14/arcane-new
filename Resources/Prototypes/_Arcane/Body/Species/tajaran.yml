- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceTajaran
  categories: [ HideSpawnMenu ]
  name: tajaran appearance
  components:
  - type: Inventory
    speciesId: tajaran
  - type: InitialBody
    organs:
      Torso: OrganTajaranTorso
      Head: OrganTajaranHead
      Tail: OrganTajaranTail
      ArmLeft: OrganTajaranArmLeft
      ArmRight: OrganTajaranArmRight
      HandLeft: OrganTajaranHandLeft
      HandRight: OrganTajaranHandRight
      LegLeft: OrganTajaranLegLeft
      LegRight: OrganTajaranLegRight
      FootLeft: OrganTajaranFootLeft
      FootRight: OrganTajaranFootRight
      Brain: OrganTajaranBrain
      Eyes: OrganTajaranEyes
      Tongue: OrganTajaranTongue
      Appendix: OrganTajaranAppendix
      Ears: OrganTajaranEars
      Lungs: OrganTajaranLungs
      Heart: OrganTajaranHeart
      Stomach: OrganTajaranStomach
      Liver: OrganTajaranLiver
      Kidneys: OrganTajaranKidneys
  - type: HumanoidProfile
    species: Tajaran

- type: entity
  parent:
  - AppearanceTajaran
  - BaseSpeciesMobOrganic
  id: MobTajaran
  name: Urist McTajaran
  components:
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - SiikMaas
    understands:
    - TauCetiBasic
    - SiikMaas
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 140
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Tajaran
  - type: TemperatureProtection
    coefficient: 0.1 # fur is a good insulator, actually
  - type: TemperatureDamage
    heatDamageThreshold: 316.15
    coldDamageThreshold: 248.15 # -25 degrees centigrade, like 12 degrees below normal "takes cold damage"
    coldDamage:
      types:
        Cold: 0.08 # in line with cold resist
    heatDamage:
      types:
        Heat: 1.8 # in line with heat dmg received up
  - type: TemperatureSpeed
    thresholds:
      301: 0.9
      295: 0.8
      285: 0.7
  - type: ThermalRegulator
    normalBodyTemperature: 311.76 # Body temperature of cat
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: petting-success-soft-floofy
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: Reactive
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPie
    - reagents: [ Water ]
      methods: [ Touch ]
      effects:
      - !type:Emote
        emote: Scream
        probability: 0.2
  - type: MeleeWeapon
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 4
        Piercing: 1
  - type: DamageOnHighSpeedImpact # Landing on all fours!
    damage:
      types:
        Blunt: 1
    soundHit:
      collection: Punch
  - type: Stamina
    baseCritThreshold: 75
  - type: TypingIndicator
    proto: alien
  - type: PseudoItem
    storedOffset: 0,17
    shape:
    - 0,0,1,4
    - 0,2,3,4
    - 4,0,5,4
  - type: NoShoesSilentFootsteps


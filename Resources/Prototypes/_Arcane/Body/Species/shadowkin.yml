- type: markingsGroup
  parent: Undergarments
  id: Shadowkin
  limits:
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ TailShadowkin ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ EarsShadowkin ]
    enum.HumanoidVisualLayers.Chest:
      limit: 8
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 8
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 8
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 8
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 8
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceShadowkin
  categories: [ HideSpawnMenu ]
  name: shadowkin appearance
  components:
  - type: Inventory
    speciesId: shadowkin
  - type: InitialBody
    organs:
      Torso: OrganShadowkinTorso
      Head: OrganShadowkinHead
      Tail: OrganShadowkinTail
      ArmLeft: OrganShadowkinArmLeft
      ArmRight: OrganShadowkinArmRight
      HandLeft: OrganShadowkinHandLeft
      HandRight: OrganShadowkinHandRight
      LegLeft: OrganShadowkinLegLeft
      LegRight: OrganShadowkinLegRight
      FootLeft: OrganShadowkinFootLeft
      FootRight: OrganShadowkinFootRight
      Brain: OrganShadowkinBrain
      Eyes: OrganShadowkinEyes
      Ears: OrganShadowkinEars
      Heart: OrganShadowkinHeart
      Stomach: OrganShadowkinStomach
      Liver: OrganShadowkinLiver
      Kidneys: OrganShadowkinKidneys
      Lungs: OrganShadowkinCore
      Tongue: OrganShadowkinTongue
      Appendix: OrganShadowkinAppendix
  - type: HumanoidProfile
    species: Shadowkin

- type: entity
  parent:
  - AppearanceShadowkin
  - BaseSpeciesMobOrganic
  id: MobShadowkin
  name: Urist McShadow
  components:
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Marish
    understands:
    - TauCetiBasic
    - Marish
  - type: Damageable
    damageModifierSet: Shadowkin
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: BlackBlood
        Quantity: 300 # Lore Accurate Shadowkin superdense iron blood.
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 130 #lower density
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: TypingIndicator
    proto: alien
  - type: CollectiveMind
    defaultChannel: Empathy
    channels:
    - Empathy
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
  # - type: Respirator # Lore Accurate Shadowkin superdense iron blood.
  #   updateInterval: 6
  #   maxSaturation: 30
  #   saturation: 30

- type: entity
  parent: SolutionStomach
  id: SolutionShadowkinStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 40
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 5

- type: entity
  parent: OrganBaseOrganic
  id: OrganShadowkin
  abstract: true
  suffix: shadowkin

- type: entity
  id: OrganShadowkinMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Animal ]

- type: entity
  parent: OrganShadowkin
  id: OrganShadowkinInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: OrganShadowkin
  id: OrganShadowkinExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Arcane/Mobs/Species/Shadowkin/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Arcane/Mobs/Species/Shadowkin/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Shadowkin

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorsoTailed, OrganShadowkinExternal ] # Shitmed - Tailed torso
  id: OrganShadowkinTorso
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Tail

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHeadBald, OrganShadowkinExternal ] # Trauma - bald
  id: OrganShadowkinHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide

- type: entity
  parent: [ OrganBaseArmLeft, OrganShadowkinExternal ]
  id: OrganShadowkinArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganShadowkinExternal ]
  id: OrganShadowkinArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganShadowkinExternal ]
  id: OrganShadowkinHandLeft

- type: entity

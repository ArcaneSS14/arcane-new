- type: entity
  parent: [ OrganBaseFootRight, OrganShadowkinExternal ]
  id: OrganShadowkinFootRight

- type: entity
  parent: [ OrganBaseTail, OrganShadowkinExternal ]
  id: OrganShadowkinTail
  components:
  - type: Sprite
    sprite: _Arcane/Mobs/Customization/Shadowkin/tails64x32.rsi
    state: shadowkin
  - type: VisualOrgan
    data:
      sprite: _Trauma/empty.rsi
      state: empty # no sprite since the markings actually control it
  - type: BadFood
  - type: Extractable
    grindableSolutionName: food
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 12
      - ReagentId: Fat
        Quantity: 3
  - type: Edible
  - type: PullerTail
    speciesWhitelist:
    - Shadowkin


- type: markingsGroup
  parent: Undergarments
  id: Synth
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 2
      required: true
      default: [ SynthVisor, SynthJawComposite ]
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ SynthSnout ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 2
      required: false
      default: [ SynthAntenna, SynthAntennaLight ]
    enum.HumanoidVisualLayers.HeadSide:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ SynthTail ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceSynth
  categories: [ HideSpawnMenu ]
  name: synth appearance
  components:
  - type: Inventory
    speciesId: synth
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Synth/displacement.rsi
            state: jumpsuit
      outerClothing:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Synth/displacement.rsi
            state: outerclothing
      shoes:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Synth/displacement.rsi
            state: shoes
      head:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Synth/displacement.rsi
            state: head
      mask:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Synth/displacement.rsi
            state: mask
      neck:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Synth/displacement.rsi
            state: neck
      gloves:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Synth/displacement.rsi
            state: gloves
  - type: InitialBody
    organs:
      Torso: OrganSynthTorso
      Head: OrganSynthHead
      Tail: OrganSynthTail
      ArmLeft: OrganSynthArmLeft
      ArmRight: OrganSynthArmRight
      HandLeft: OrganSynthHandLeft
      HandRight: OrganSynthHandRight
      LegLeft: OrganSynthLegLeft
      LegRight: OrganSynthLegRight
      FootLeft: OrganSynthFootLeft
      FootRight: OrganSynthFootRight
      Brain: OrganSynthBrain
      Eyes: OrganSynthEyes
      Tongue: OrganSynthTongue
      Appendix: OrganSynthAppendix
      Ears: OrganSynthEars
      Lungs: OrganSynthLungs
      Heart: OrganSynthHeart
      Stomach: OrganSynthStomach
      Liver: OrganSynthLiver
      Kidneys: OrganSynthKidneys
      Battery: OrganSynthPowerCell
  - type: HumanoidProfile
    species: Synth

# Synths are robotic: no respirator and no injection port, so they skip MobRespirator and InjectableSolution.
- type: entity
  parent:
  - AppearanceSynth
  - BaseSpeciesMob
  - MobAtmosStandard
  - MobFlammable
  - BaseHungerThirstSlowdown
  id: MobSynth
  name: Urist McBeeper
  components:
  - type: Icon
    sprite: _Arcane/Mobs/Species/Synth/parts.rsi
    state: full
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - RobotTalk
    understands:
    - TauCetiBasic
    - RobotTalk
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
  - type: TypingIndicator
    proto: robot
  - type: Vocal
    emoteSounds: UnisexSilicon
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: Satiation
    satiations:
      Hunger:
        prototype: SynthHunger
      Thirst:
        prototype: NormalSatiationThirst
  - type: Damageable
    damageModifierSet: Synth
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    damage:
      types:
        Blunt: 6
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.25
        Heat: 0.05
  - type: Temperature
    temperature: 310.15
    specificHeat: 30
  - type: TemperatureDamage
    heatDamageThreshold: 360
    coldDamageThreshold: 220
    coldDamage:
      types:
        Cold: 0.1
    heatDamage:
      types:
        Heat: 1.5
  - type: TemperatureSpeed
    thresholds:
      260: 0.9
      240: 0.8
      220: 0.7
  - type: ThermalRegulator
    metabolismHeat: 500
    radiatedHeat: 150
    implicitHeatRegulation: 700
    sweatHeatRegulation: 1200
    shiveringHeatRegulation: 400
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 4
  - type: FireVisuals
    alternateState: Standing
  - type: Blindable
  - type: Puller
    needsHands: false
  - type: Butcherable
    spawned:
    - id: OrganSynthAppendix
      amount: 5
  - type: SolutionManager
  - type: Bloodstream
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -1
    bloodRefreshAmount: 0
    bloodReferenceSolution:
      reagents:
      - ReagentId: SynthBlood
        Quantity: 300
  - type: SynthBloodstream
    minBloodLevel: 0.3
    fullEfficiencyBloodLevel: 0.9
    minBloodEfficiency: 0.1
    minHunger: 50
    hungerCostPerRepair: 1.5
    hungerCostPerBleed: 2
    bleedReductionAmount: 0.25
    damage:
      groups:
        Brute: -1.25
        Burn: -1.5
      types:
        Bloodloss: -0.1
        Cellular: -0.035
    bloodRegeneration:
      targetBloodLevel: 1
      bloodRefreshAmount: 0.3
      hungerCostPerUnit: 0.5
  - type: SynthBattery
    drawRate: 0.4
    nutrimentChargeMultiplier: 2.4
    batteryLowText: synth-battery-low
    batteryDeadText: synth-battery-dead
    batteryEmpText: synth-battery-emp
    warningPercentages: [ 20, 10 ]
    batteryLowSound:
      path: /Audio/Machines/twobeep.ogg
      params:
        maxDistance: 5
    batteryDeadSound:
      path: /Audio/Machines/buzz-two.ogg
      params:
        maxDistance: 5
    empDamage:
      types:
        Shock: 10
        Heat: 10
  - type: SynthShock
    batteryChargeMultiplier: 10.8
    cellularDamageMultiplier: 0.2
  - type: ZombieImmune
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - SiliconEmotes
    - Synth

- type: entity

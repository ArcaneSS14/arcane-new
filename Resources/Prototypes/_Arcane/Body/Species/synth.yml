- type: entity
  parent: [ OrganBaseBrain, OrganSynthInternal ]
  id: OrganSynthBrain
  name: synth ccu
  description: Effectively a Synth's brain. It's somehow smoother than yours.
  components:
  - type: Sprite
    layers:
    - state: brain
    scale: 0.65, 0.65
  - type: BorgBrain

- type: entity
  parent: [ OrganBaseEyes, OrganSynthInternal ]
  id: OrganSynthEyes
  name: camera gimbal
  description: A small mechanical gimbal featuring several multi-spectrum cameras, responsible for Synth vision.
  components:
  - type: Sprite
    layers:
    - state: eyes
    scale: 0.8, 0.8
  - type: VisualOrgan
    data:
      sprite: _Arcane/Mobs/Species/Synth/parts.rsi
      state: eyes
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Eyes
      group: Synth

- type: entity
  parent: [ OrganBaseTongue, OrganSynthInternal ]
  id: OrganSynthTongue
  name: synth tongue
  description: It's a tongue, capable of unspeakable things. It has a small logo on the back of an offensively pink Synth. You don't know why you find it offensive.
  components:
  - type: Sprite
    layers:
    - state: tongue

- type: entity
  parent: [ OrganBaseAppendix, OrganSynthInternal ]
  id: OrganSynthAppendix
  name: red brick
  description: If you see this, it's already too late. I'm sorry.
  components:
  - type: Sprite
    layers:
    - state: appendix
    scale: 0.6, 0.6

- type: entity
  parent: [ OrganBaseEars, OrganSynthInternal ]
  id: OrganSynthEars
  name: audio pack
  description: A sensor pack designed to be installed in a Synth. This one contains audio sensors.
  components:
  - type: Sprite
    layers:
    - state: ears
    scale: 0.7, 0.7

- type: entity
  parent: [ OrganBaseLungs, OrganSynthInternal, OrganSynthMetabolizer ]
  id: OrganSynthLungs
  name: synth lungs
  description: Synth lungs simulating organic functions for internal cooling. Not very interesting on their own.
  components:
  - type: Sprite
    layers:
    - state: lungs

- type: entity
  parent: [ OrganBaseHeart, OrganSynthInternal ]
  id: OrganSynthHeart
  name: synth heart
  description: A Synth heart. It circulates fullerene and nanites through the body.
  components:
  - type: Sprite
    layers:
    - state: heart
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ Synth ]

- type: entity
  parent: [ OrganBaseStomach, OrganSynthInternal ]
  id: OrganSynthStomach
  name: synth stomach
  description: A Synth stomach. It can convert minerals to nutriment and nutriment to nanites.
  components:
  - type: Sprite
    layers:
    - state: stomach
  - type: SolutionManager
    solutions:
    - SolutionSynthStomach
  - type: Stomach
    specialDigestible:
      tags:
      - RawMaterial
      - ConstructionMaterial
      - Ore
    isSpecialDigestibleExclusive: false
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [ Synth ]

- type: entity
  parent: SolutionStomach
  id: SolutionSynthStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 50

- type: entity
  parent: [ OrganBaseLiver, OrganSynthInternal, OrganSynthMetabolizer ]
  id: OrganSynthLiver
  name: synth liver
  description: A Synth liver. It prevents poisoning from alcohol and can convert ethanol to nutriment.
  components:
  - type: Sprite
    layers:
    - state: liver
    scale: 0.8, 0.8

- type: entity
  parent: [ OrganBaseKidneys, OrganSynthInternal, OrganSynthMetabolizer ]
  id: OrganSynthKidneys
  name: energy coil
  description: A Synth energy coil. It filters out anything the rest of the body has no use for.
  components:
  - type: Sprite
    layers:
    - state: kidneys
    scale: 1.1, 1.1

- type: entity
  parent: [ PowerCellMedium, OrganBaseChildInternal ]
  id: OrganSynthPowerCell
  name: synth power cell
  description: A rechargeable power cell shaped to fit inside a Synth's endoskeleton. Can be topped up in any cell recharger.
  components:
  - type: ChildOrgan
    parents: [ Torso ]
  - type: Organ
    category: Battery
  - type: SynthPowerCell
  - type: Tag
    tags:
    - PowerCell
    - Organ

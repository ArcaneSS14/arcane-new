- type: entity
  parent: [ OrganBaseLegRight, OrganChitinidExternal ]
  id: OrganChitinidLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganChitinidExternal ]
  id: OrganChitinidFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganChitinidExternal ]
  id: OrganChitinidFootRight

- type: entity
  parent: [ OrganBaseTail, OrganChitinidExternal ]
  id: OrganChitinidTail
  components:
  - type: Sprite
    sprite: _Arcane/Mobs/Customization/Chitinid/chitinid_wings.rsi
    state: default
  - type: VisualOrgan
    data:
      sprite: _Trauma/empty.rsi
      state: empty # no sprite since the markings actually control it


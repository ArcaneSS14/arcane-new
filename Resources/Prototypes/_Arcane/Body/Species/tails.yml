# Tails and wings for species whose base body has none, so they can wear tail and wing markings.

- type: entity
  parent: [ OrganBaseTail, OrganHumanExternal ]
  id: OrganHumanTail
  components:
  - type: Sprite
    sprite: _Trauma/Mobs/Species/Vulpkanin/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Trauma/empty.rsi
      state: empty # the tail marking draws it


- type: markingsGroup
  parent: Undergarments
  id: Demon
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 5
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ DemonTailDefault ]
    enum.HumanoidVisualLayers.Wings:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceDemon
  categories: [ HideSpawnMenu ]
  name: demon appearance
  components:
  - type: Inventory
    speciesId: demon
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganDemonTorso
      Head: OrganDemonHead
      Tail: OrganDemonTail
      Wings: OrganDemonWings
      ArmLeft: OrganDemonArmLeft
      ArmRight: OrganDemonArmRight
      HandRight: OrganDemonHandRight
      HandLeft: OrganDemonHandLeft
      LegLeft: OrganDemonLegLeft
      LegRight: OrganDemonLegRight
      FootLeft: OrganDemonFootLeft
      FootRight: OrganDemonFootRight
      Brain: OrganHumanBrain
      Eyes: OrganDemonEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Demon

- type: entity
  parent:
  - AppearanceDemon
  - BaseSpeciesMobOrganic
  id: MobDemon
  name: Urist McDemon
  components:
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Karshan
    understands:
    - TauCetiBasic
    - Karshan
  - type: Icon
    sprite: _Arcane/Mobs/Species/Demon/parts.rsi
    state: full_m
  - type: Butcherable
    spawned:
    - id: FoodMeatDemon
      amount: 5
  - type: Speech
    speechSounds: Lizard
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Piercing: 5
  - type: TemperatureDamage
    heatDamageThreshold: 325
    coldDamageThreshold: 260
    coldDamage:
      types:
        Cold: 0.085
    heatDamage:
      types:
        Heat: 0.8
  - type: Faoli
  - type: BonusMeleeDamage
    damageModifierSet:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Asphyxiation: 0.85
  - type: RecoilAbsorber
    modifier: 0.5
  - type: WeakToHoly
  - type: Sprinter
    staminaDrainRate: 13
    sprintSpeedMultiplier: 1.63


- type: entity
  parent: MobDemon
  id: MobDemonRandom
  name: Urist McDemon
  suffix: Random Appearance
  components:
  - type: RandomHumanoidAppearance
  - type: RandomMetadata
    nameSegments:
    - NamesFirst
    - NamesLast
    nameFormat: name-format-standard
- type: entity
  parent: OrganBaseOrganic
  id: OrganDemon
  abstract: true
  suffix: demon

- type: entity
  parent: OrganDemon
  id: OrganDemonExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Arcane/Mobs/Species/Demon/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Arcane/Mobs/Species/Demon/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Demon

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorsoTailed, OrganDemonExternal ]
  id: OrganDemonTorso
  components:
  - type: BodyPart
    slots:
    # parts
    - Head
    - Tail
    - Wings
    - ArmLeft
    - ArmRight
    - LegLeft
    - LegRight
    # organs
    - Appendix
    - Heart
    - Lungs
    - Stomach
    - Liver
    - Kidneys

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganDemonExternal ]
  id: OrganDemonHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide

- type: entity
  parent: [ OrganBaseTail, OrganDemonExternal ]
  id: OrganDemonTail
  components:
  - type: VisualOrgan
    data:
      sprite: _Trauma/empty.rsi
      state: empty # the tail marking draws it

- type: entity
  parent: [ OrganBaseWings, OrganDemonExternal ]
  id: OrganDemonWings
  components:
  - type: Sprite
    sprite: _Trauma/Mobs/Species/Moth/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Trauma/empty.rsi
      state: empty # the wings marking draws them

- type: entity
  parent: [ OrganBaseEyes, OrganHumanInternal, OrganDemonExternal ]
  id: OrganDemonEyes
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Customization/eyes.rsi

- type: entity
  parent: [ OrganBaseArmLeft, OrganDemonExternal ]
  id: OrganDemonArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganDemonExternal ]
  id: OrganDemonArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganDemonExternal ]
  id: OrganDemonHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganDemonExternal ]
  id: OrganDemonHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganDemonExternal ]
  id: OrganDemonLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganDemonExternal ]
  id: OrganDemonLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganDemonExternal ]
  id: OrganDemonFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganDemonExternal ]
  id: OrganDemonFootRight

- type: entity
  parent:
  - AppearanceResomi
  - BaseSpeciesMobOrganic
  id: MobResomi
  name: Urist McRaptor
  components:
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Schechi
    understands:
    - TauCetiBasic
    - Schechi
  - type: Speech
    speechVerb: Parrot
    speechSounds: MaleAvali
    allowedEmotes: [ 'Chirp', 'Trill', 'Warble', 'Wurble' ]
  - type: Vocal
    emoteSounds: MaleAvaliEmote
  - type: FireVisuals
    sprite: _Arcane/Mobs/Effects/Resomi/onfire.rsi
    normalState: Resomi_minor_burning
    alternateState: Resomi_burning
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.32
        density: 160
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Resomi
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: AmmoniaBlood
        Quantity: 300
  - type: TemperatureDamage
    heatDamageThreshold: 320.15
    coldDamageThreshold: 0
    coldDamage:
      types:
        Cold: 0
    heatDamage:
      types:
        Heat: 3
  - type: TemperatureSpeed
    thresholds:
      272: 1
      242: 1
      196: 1
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: PseudoItem
    storedOffset: 20,0
    shape:
    - 0,2,0,3
    - 1,3,2,3
    - 3,2,3,3
    - 4,0,5,4
    - 6,0,6,3
    - 7,0,7,1
  - type: CreamPied
    sprite:
      sprite: _Arcane/Effects/creampie.rsi
      state: creampie_resomi


- type: markingsGroup
  parent: Undergarments
  id: Hydrakin
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Eyes:
      limit: 1
      required: true
      default: [ HydrakinEyesDefault ]
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ HydrakinEarsDefault ]
    enum.HumanoidVisualLayers.Chest:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.Overlay:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ HydrakinTailDefault ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceHydrakin
  categories: [ HideSpawnMenu ]
  name: hydrakin appearance
  components:
  - type: Inventory
    speciesId: hydrakin
    templateId: hydrakin
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Hydrakin/displacement.rsi
            state: jumpsuit
      gloves:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Hydrakin/displacement.rsi
            state: gloves
      shoes:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Hydrakin/displacement.rsi
            state: shoes
      head:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Hydrakin/displacement.rsi
            state: head
      neck:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Hydrakin/displacement.rsi
            state: neck
      belt:
        sizeMaps:
          32:
            sprite: _Arcane/Mobs/Species/Hydrakin/displacement.rsi
            state: belt
  - type: InitialBody
    organs:
      Torso: OrganHydrakinTorso
      Head: OrganHydrakinHead
      Tail: OrganHydrakinTail
      ArmLeft: OrganHydrakinArmLeft
      ArmRight: OrganHydrakinArmRight
      HandLeft: OrganHydrakinHandLeft
      HandRight: OrganHydrakinHandRight
      LegLeft: OrganHydrakinLegLeft
      LegRight: OrganHydrakinLegRight
      FootLeft: OrganHydrakinFootLeft
      FootRight: OrganHydrakinFootRight
      Brain: OrganHydrakinBrain
      Eyes: OrganHydrakinEyes
      Tongue: OrganHydrakinTongue
      Appendix: OrganHydrakinAppendix
      Ears: OrganHydrakinEars
      Lungs: OrganHydrakinLungs
      Heart: OrganHydrakinHeart
      Stomach: OrganHydrakinStomach
      Liver: OrganHydrakinLiver
      Kidneys: OrganHydrakinKidneys
  - type: HumanoidProfile
    species: Hydrakin

- type: entity
  parent:
  - AppearanceHydrakin
  - BaseSpeciesMobOrganic
  id: MobHydrakin
  name: Urist McHydra
  components:
  - type: Icon
    sprite: _Arcane/Mobs/Species/Hydrakin/parts.rsi
    state: full
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Hydraspeak
    understands:
    - TauCetiBasic
    - Hydraspeak
  - type: Speech
    speechVerb: Hydrakin
    speechSounds: Hydrakin
    allowedEmotes: [ Trill, Wurble ]
  - type: Vocal
    emoteSounds: UnisexHydrakin
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: TypingIndicator
    proto: robot
  - type: Satiation
    satiations:
      Hunger:
        prototype: NormalSatiationHunger
      Thirst:
        prototype: NormalSatiationThirst
  - type: Damageable
    damageModifierSet: Hydrakin
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: AmmoniaBlood
        Quantity: 200
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Butcherable
    spawned:
    - id: FoodMeatChicken
      amount: 5
  - type: TemperatureDamage
    coldDamageThreshold: 10
    heatDamageThreshold: 332
    coldDamage:
      types:
        Cold: 0.01
  - type: TemperatureSpeed
    thresholds:
      90: 0.9
      40: 0.75
      10: 0.6
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 250
    sweatHeatRegulation: 350
    shiveringHeatRegulation: 800
    normalBodyTemperature: 210.15
    thermalRegulationTemperatureThreshold: 30
  - type: PressureProtection
    lowPressureMultiplier: 1.2
  - type: Hydrakin

- type: entity
  parent: MobHydrakin
  id: MobHydrakinRandom
  suffix: Random Appearance
  components:
  - type: RandomHumanoidAppearance
  - type: RandomMetadata
    nameSegments:
    - NamesHydrakin

- type: entity
  parent: OrganBaseOrganic
  id: OrganHydrakin
  abstract: true
  suffix: hydrakin
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: AmmoniaBlood
        Quantity: 5

- type: entity
  id: OrganHydrakinMetabolizer
  abstract: true
  components:
  - type: Metabolizer

- type: markingsGroup
  parent: Undergarments
  id: Oni
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ OniHornDoubleCurved ]
    enum.HumanoidVisualLayers.HeadSide:
      limit: 3
      required: true
      default: [ PointyEarsUpwards ]
    enum.HumanoidVisualLayers.Snout:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 8
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 3
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceOni
  categories: [ HideSpawnMenu ]
  name: oni appearance
  components:
  - type: Inventory
    speciesId: oni
  - type: InitialBody
    organs:
      Torso: OrganOniTorso
      Head: OrganOniHead
      ArmLeft: OrganOniArmLeft
      ArmRight: OrganOniArmRight
      HandLeft: OrganOniHandLeft
      HandRight: OrganOniHandRight
      LegLeft: OrganOniLegLeft
      LegRight: OrganOniLegRight
      FootLeft: OrganOniFootLeft
      FootRight: OrganOniFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Oni

- type: entity
  parent:
  - AppearanceOni
  - BaseSpeciesMobOrganic
  id: MobOni
  name: Urist McOni
  components:
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    understands:
    - TauCetiBasic
  - type: Speech
    speechSounds: Baritone
    speechVerb: Oni
  - type: TypingIndicator
    proto: oni
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 220
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Oni
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 300

- type: entity
  parent: OrganBaseOrganic
  id: OrganOni
  abstract: true
  suffix: oni

- type: entity
  parent: OrganOni
  id: OrganOniExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Oni

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganOniExternal ]
  id: OrganOniTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHeadBald, OrganOniExternal ] # Trauma - bald
  id: OrganOniHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide

- type: entity
  parent: [ OrganBaseArmLeft, OrganOniExternal ]
  id: OrganOniArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganOniExternal ]
  id: OrganOniArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganOniExternal ]
  id: OrganOniHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganOniExternal ]
  id: OrganOniHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganOniExternal ]
  id: OrganOniLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganOniExternal ]
  id: OrganOniLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganOniExternal ]
  id: OrganOniFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganOniExternal ]

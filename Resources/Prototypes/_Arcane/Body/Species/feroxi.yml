    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: OrganFeroxi
  id: OrganFeroxiExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Arcane/Mobs/Species/Feroxi/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Arcane/Mobs/Species/Feroxi/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Feroxi

- type: entity

- type: markingsGroup
  parent: Undergarments
  id: Feroxi
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ FeroxiEars ]
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ FeroxiSnout ]
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ FeroxiTailAndDorsal ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFeroxi
  categories: [ HideSpawnMenu ]
  name: feroxi appearance
  components:
  - type: Inventory
    speciesId: feroxi
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: jumpsuit-female
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: shoes
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: shoes
  - type: InitialBody
    organs:
      Torso: OrganFeroxiTorso
      Head: OrganFeroxiHead
      Tail: OrganFeroxiTail
      ArmLeft: OrganFeroxiArmLeft
      ArmRight: OrganFeroxiArmRight
      HandLeft: OrganFeroxiHandLeft
      HandRight: OrganFeroxiHandRight
      LegLeft: OrganFeroxiLegLeft
      LegRight: OrganFeroxiLegRight
      FootLeft: OrganFeroxiFootLeft
      FootRight: OrganFeroxiFootRight
      Brain: OrganFeroxiBrain
      Eyes: OrganFeroxiEyes
      Tongue: OrganFeroxiTongue
      Appendix: OrganFeroxiAppendix
      Ears: OrganFeroxiEars
      Lungs: OrganFeroxiLungs
      Heart: OrganFeroxiHeart
      Stomach: OrganFeroxiStomach
      Liver: OrganFeroxiLiver
      Kidneys: OrganFeroxiKidneys
  - type: HumanoidProfile
    species: Feroxi

- type: entity
  parent:
  - AppearanceFeroxi
  - BaseSpeciesMobOrganic
  id: MobFeroxi
  name: Urist McFin
  components:
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Nehina
    understands:
    - TauCetiBasic
    - Nehina
  - type: Speech
    speechVerb: Feroxi
    speechSounds: Tenor
    allowedEmotes: [ 'Gnash' ]
  - type: Vocal
    emoteSounds: MaleFeroxi
  - type: TypingIndicator
    proto: feroxi
  - type: Satiation
    satiations:
      Hunger:
        prototype: NormalSatiationHunger
      Thirst:
        prototype: FeroxiThirst
  - type: Damageable
    damageModifierSet: Feroxi
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 30
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 7
  - type: FeroxiDehydrate
    hydratedMetabolizer: Feroxi
    dehydratedMetabolizer: FeroxiDehydrated
    dehydrationThreshold: 150
  - type: CreamPied
    sprite:
      sprite: _Arcane/Effects/creampie.rsi
      state: creampie_feroxi

- type: entity
  parent: OrganBaseOrganic
  id: OrganFeroxi
  abstract: true
  suffix: feroxi

- type: entity
  id: OrganFeroxiMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Feroxi ]

- type: entity
  id: OrganFeroxiStomachMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Feroxi, Animal ]

- type: entity
  parent: OrganFeroxi
  id: OrganFeroxiInternal
  abstract: true

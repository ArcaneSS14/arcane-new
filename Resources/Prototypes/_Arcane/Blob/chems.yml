- type: blobChem
  id: ComatoseFiber
  blobbernautDamageModifiers: BlobBlobbernaut
  chargeSpecialTileCosts: true
  spaceGrowthCost: 6
  name: "comatose fiber"
  info: |
    Deals 22 asphyxiation and 150 structural damage.
    Growing in space costs the same as growing on a floor.
  color: "#191978"
  damage:
    types:
      Asphyxiation: 22
      Structural: 150
  smokeSolution:
    reagents:
    - ReagentId: ChloralHydrate
      Quantity: 30

- type: blobChem
  id: ChainCoating
  chargeSpecialTileCosts: true
  spaceGrowthCost: 23
  tileCostOverrides:
    Normal: 9
    Strong: 10
    Reflective: 10
    Factory: 100
    Resource: 85

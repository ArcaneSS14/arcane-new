  name: "chain coating"
  info: |
    Deals 12 blunt and 12 slash damage, and 150 structural damage.
    Blob tiles become more resistant, while growth costs increase and resource production decreases.
  color: "#3b3b3b"
  damage:
    types:
      Blunt: 12
      Slash: 12
      Structural: 150
  smokeSolution:
    reagents:
    - ReagentId: Razorium
      Quantity: 30
  blobbernautDamageModifiers: BlobBlobbernautChainCoating
  damageModifiers: ChainCoatingBlob
  bonusPoints: -1


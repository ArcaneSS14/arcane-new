- type: tile
  id: FloorArcaneLavalandPaleGrass
  parent: FloorPlanetAsh
  name: tiles-arcane-lavaland-pale-grass
  sprite: /Textures/Tiles/Grass/grass.png
  variants: 6
- type: biomeTemplate
  id: PaleForest
  layers:
  # Normal lavaland things included on basalt tiles
  - !type:BiomeEntityLayer
    threshold: 0.95
    noise:
      frequency: 1
      seed: 15
    allowedTiles:
    - FloorArcaneLavalandPaleGrass
    - FloorBasaltLavaland
    entities:
    - BasaltOne
    - BasaltTwo
    - BasaltThree
    - BasaltFour
    - BasaltFive
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorArcaneLavalandPaleGrass
    - FloorBasaltLavaland
    threshold: 0.95
    divisions: 1
    noise:
      seed: 25
      frequency: 1
    decals:
    - Basalt1
    - Basalt2
    - Basalt3
    - Basalt4
    - Basalt5
    - Basalt6
    - Basalt7
    - Basalt8
    - Basalt9
  - !type:BiomeEntityLayer
    threshold: 0.95
    noise:
      seed: 50
      noiseType: OpenSimplex2
      frequency: 2
    allowedTiles:
    - FloorArcaneLavalandPaleGrass
    - FloorBasaltLavaland
    entities:
    - FloraRockSolid # Rock is flora apparently by the way.
  # Vegetation
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorArcaneLavalandPaleGrass
    threshold: 0.85
    noise:
      seed: 2
      noiseType: OpenSimplex2
      fractalType: PingPong
    entities:
    - AshBush
  # Food (mushrooms)
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorArcaneLavalandPaleGrass
    threshold: 0.9
    noise:
      seed: 2
      noiseType: OpenSimplex2
      fractalType: PingPong
    entities:
    - Lavashroom
  # Fruit (seraka mushrooms)
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorBasaltLavaland
    - FloorArcaneLavalandPaleGrass
    threshold: 0.9
    noise:
      seed: 2
      noiseType: OpenSimplex2
      fractalType: PingPong
      frequency: 2
    entities:
    - SerakaMushroom
  # Sprouts
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorBasaltLavaland
    - FloorArcaneLavalandPaleGrass
    - FloorPlanetAsh
    threshold: 0.5
    noise:
      seed: -1
      noiseType: OpenSimplex2
      fractalType: PingPong
      frequency: 2
    entities:
    - FloraAshSprouts
    - FloraPaleSprouts
  # Flowers
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorArcaneLavalandPaleGrass
    - FloorPlanetAsh
    threshold: 0.7
    noise:
      seed: -1
      noiseType: OpenSimplex2
      fractalType: PingPong
      frequency: 2
    entities:
    - FloraAshYellowFlowers
  # Trees
  - !type:BiomeEntityLayer
    threshold: 0.70 # More rare than ash trees
    noise:
      seed: 60
      noiseType: OpenSimplex2
      fractalType: FBm
      frequency: 2
    allowedTiles:
    - FloorArcaneLavalandPaleGrass
    entities:
    - FloraAshtreePale
  - !type:BiomeDummyLayer
    id: Loot
  # Rock formations
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorArcaneLavalandPaleGrass
    threshold: 0.1 # Almost none
    noise:
      seed: 5
      noiseType: Cellular
      frequency: 0.05
      lacunarity: 2
      fractalType: FBm
      octaves: 5
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    entities:
    - AsteroidRock
  # Fill basalt & ash grass
  - !type:BiomeTileLayer
    threshold: -1.0
    tile: FloorArcaneLavalandPaleGrass
    noise: # Makes ash forests spawn in "islands"
      seed: 10
      frequency: 0.02
      gain: 0.2
      noiseType: OpenSimplex2
      fractalType: FBm
      weightedStrength: -0.1

- type: entity
  id: BaseLavalandFlora
  abstract: true
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
  - type: Clickable
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  name: gray sprouts
  id: FloraAshSprouts
  parent: BaseLavalandFlora
  description: Sprouts that look completely clean, they seem to have a very smooth surface.
  components:
  - type: Sprite
    sprite: _Arcane/Lavaland/Objects/Decoration/Flora/Misc/dark_sprouts.rsi
    layers:
    - state: sprout1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        sprout1: ""
        sprout2: ""
        sprout3: ""
        sprout4: ""
        sprout5: ""
        sprout6: ""
  - type: Harvestable
    delay: 2
    loot: MaterialFlowersAsh1

- type: entity
  name: pale sprouts
  id: FloraPaleSprouts
  parent: BaseLavalandFlora
  description: Sprouts that look completely clean, they seem to have a very smooth surface. These ones look more natural.
  components:
  - type: Sprite
    sprite: _Arcane/Lavaland/Objects/Decoration/Flora/Misc/light_sprouts.rsi
    layers:
    - state: sprout1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        sprout1: ""
        sprout2: ""
        sprout3: ""
        sprout4: ""
        sprout5: ""
        sprout6: ""
  - type: Harvestable
    delay: 2
    loot: MaterialFlowersPale1

- type: entity
  name: yellow flowers
  id: FloraAshYellowFlowers
  parent: BaseLavalandFlora
  description: A group of yellow flowers. They look weak, and yet still manage to survive in this place.
  components:
  - type: Sprite
    sprite: _Arcane/Lavaland/Objects/Decoration/Flora/Misc/yellow_flowers.rsi
    layers:
    - state: flowers1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        flowers1: ""
        flowers2: ""
        flowers3: ""
  - type: Harvestable
    delay: 2
    loot: MaterialFlowersPale1 # TODO add yellow flowers and something with them

- type: entity
  parent: FloraAshtree
  id: FloraAshtreePale
  name: pale tree
  components:
  - type: Sprite
    sprite: _Arcane/Lavaland/Objects/Decoration/Flora/Trees/ashtree_pale.rsi
    layers:
    - state: tree1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        tree1: ""
        tree2: ""

- type: entity
  abstract: true
  name: base cudgel
  parent: [ BaseItem, BaseMinorContraband ]
  id: WeaponCudgelBase
  description: A piece of wood sharpened for easier grip. A primitive hunters favorite, perfect for barbaric destruction!
  components:
  - type: MeleeWeapon
    animationRotation: -135
    heavyStaminaCost: 15
    wideAnimationRotation: -135
    attackRate: 0.8
  - type: StaminaDamageOnHit
    damage: 10
  - type: Wieldable
  - type: Item
    size: Large
    shape:
    - 0,0,0,3
  - type: Tool
    qualities:
    - Rolling
    speedModifier: 0.6 # a bit unwieldly but does the job
  - type: Clothing
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/cudgel.rsi
    quickEquip: false
    slots:
    - belt
  - type: UndetectableContraband

- type: entity
  name: wood cudgel
  parent: WeaponCudgelBase
  id: WeaponCudgelWood
  components:
  - type: Sprite
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/cudgel.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 9
        Structural: 5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 4
        Structural: 15
  - type: Item
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/cudgel.rsi
    storedSprite:
      state: world_icon
      sprite: _Arcane/Lavaland/Objects/Weapons/Melee/cudgel.rsi
  - type: Clothing
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/cudgel.rsi
  - type: PhysicalComposition
    materialComposition:
      Wood: 300
  - type: Construction
    graph: WoodenCudgel
    node: cudgel

- type: entity
  name: ashwood cudgel
  parent: WeaponCudgelBase
  id: WeaponCudgelAshwood
  components:
  - type: Sprite
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/ashwood_cudgel.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10
        Structural: 5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 6
        Structural: 15
  - type: Item
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/ashwood_cudgel.rsi
    storedRotation: 90
    storedSprite:
      state: world_icon
      sprite: _Arcane/Lavaland/Objects/Weapons/Melee/ashwood_cudgel.rsi
  - type: Clothing
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/ashwood_cudgel.rsi
  - type: PhysicalComposition
    materialComposition:
      Ashwood: 300
  - type: Construction
    graph: AshwoodCudgel
    node: cudgel

- type: entity
  name: incomplete wooden cudgel
  parent: [ BaseItem, BaseMinorContraband ]
  id: IncompleteWoodCudgel
  description: A few planks of wood stuck together.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    state: icon
  - type: Item
    size: Normal
    shape:
    - 0,0,0,3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
  - type: Construction
    graph: WoodenCudgel
    node: incompleteCudgel

- type: entity
  name: incomplete ashwood cudgel
  parent: [ BaseItem, BaseMinorContraband ]
  id: IncompleteAshwoodCudgel
  description: A few planks of wood stuck together.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    state: icon
  - type: Item
    size: Normal
    shape:
    - 0,0,0,3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/incomplete_bat.rsi
    sprite: Objects/Weapons/Melee/incomplete_bat.rsi
  - type: Construction
    graph: AshwoodCudgel
    node: incompleteCudgel

- type: entity
  name: wooden pickaxe
  parent: Pickaxe
  id: PickaxeWood
  description: A couple strong sticks stuck together. Decent at breaking rocks.
  components:
  - type: Item
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/wood_pickaxe.rsi
  - type: Sprite
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/wood_pickaxe.rsi
    state: pickaxe
  - type: MeleeWeapon
    heavyStaminaCost: 2
    attackRate: 0.8
    damage:
      types:
        Piercing: 5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 4
        Structural: 16
  - type: PhysicalComposition
    materialComposition:
      Wood: 500
      Cloth: 300
  - type: Construction
    graph: PickaxeWood
    node: pickaxe

- type: entity
  name: ashwooden pickaxe
  parent: Pickaxe
  id: PickaxeAshwood
  description: A couple strong sticks stuck together. Decent at breaking rocks, and also people.
  components:
  - type: Item
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/ashwood_pickaxe.rsi
  - type: Sprite
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/ashwood_pickaxe.rsi
    state: pickaxe
  - type: MeleeWeapon
    heavyStaminaCost: 1
    attackRate: 0.8
    damage:
      types:
        Piercing: 5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 6
        Structural: 16
  - type: PhysicalComposition
    materialComposition:
      Ashwood: 500
      Cloth: 300
  - type: Construction
    graph: PickaxeAshwood
    node: pickaxe

- type: entity
  name: diamond pickaxe
  parent: [ Pickaxe, BaseSalvageContraband ]
  id: PickaxeDiamond
  description: Covered with diamond to reduce weight, notched to perfection for jamming it into rocks.
  components:
  - type: Item
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/diamond_pickaxe.rsi
  - type: Sprite
    sprite: _Arcane/Lavaland/Objects/Weapons/Melee/diamond_pickaxe.rsi
    state: pickaxe
  - type: MeleeWeapon
    attackRate: 1.1
    damage:
      types:
        Piercing: 8
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 12
        Structural: 50
  - type: PhysicalComposition
    materialComposition:
      Steel: 200
      Diamond: 50
      Wood: 125

- type: entity
  name: super mining drill
  parent: [ MiningDrill, BaseSalvageContraband ]
  id: MiningDrillSuper
  description: An even more efficient mining drill with faster mining speed and range.
  components:
  - type: Sprite
    sprite: Objects/Tools/handdrilldiamond.rsi
    state: handdrill
    color: "#B2E7D2"
  - type: MeleeWeapon
    range: 2
    attackRate: 5.5
    damage:
      types:
        Piercing: 6
        Structural: 31
  - type: PhysicalComposition
    materialComposition:
      Gold: 500
      Steel: 250
      Plastic: 150
      Silver: 100
      Plasma: 100
      BSCrystal: 100
      Diamond: 50

- type: entity
  name: super plasma cutter
  parent: [ WeaponPlasmaCutter, BaseSalvageContraband ]
  id: WeaponSuperPlasmaCutter
  description: A strong mining weapon that can mine even bigger tunnels through rocks.
  components:
  - type: Item
    sprite: _Arcane/Lavaland/Objects/Weapons/Guns/Battery/super_cutter.rsi
  - type: Sprite
    sprite: _Arcane/Lavaland/Objects/Weapons/Guns/Battery/super_cutter.rsi
    state: icon
  - type: Gun
    fireRate: 2
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatteryAmmoProvider
    proto: BulletSuperPlasmaCutter
    fireCost: 40
  - type: StaticPrice
    price: 2000
  - type: PhysicalComposition
    materialComposition:
      Gold: 400
      Steel: 200
      Glass: 150
      Plasma: 150
      BSCrystal: 100
      Silver: 100
      Diamond: 50

- type: entity
  parent: WeaponSuperPlasmaCutter
  id: WeaponSuperPlasmaCutterEmpty
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0

- type: entity
  parent: [BaseItem, BaseMajorContraband]
  id: IncompleteBoneAxe
  name: unfinished bone axe
  description: The assembled head and handle need to be shaped before this can serve as an axe.
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Weapons/Melee/bone_axe.rsi
    state: icon
    color: "#B7A397"
  - type: Item
    size: Ginormous
  - type: Construction
    graph: BoneAxeConstructionGraph
    node: incompleteAxe

- type: entity
  id: BulletSuperPlasmaCutter
  name: super cutter bolt
  parent: BulletPlasmaCutter
  categories: [ HideSpawnMenu ]
  description: Not too bad, but you still don't want to get hit by it.
  components:
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: false
        mask:
        - Opaque
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 2
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: False
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Heat: 10
  - type: StaminaDamageOnCollide
    damage: 10
  - type: TimedDespawn
    lifetime: 0.25

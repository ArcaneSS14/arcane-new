- type: constructionGraph
  id: ArcaneLavalandCloth
  start: start
  graph:
  - node: start
    edges:
    - to: cloth
      steps:
      - material: FlowersAsh
        amount: 2
        doAfter: 2

  - node: paleflower
    edges:

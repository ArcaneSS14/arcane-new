- type: entity
  parent: CardBoxBase
  id: CardBoxBlack
  name: black deck box
  components:
  - type: Sprite
    sprite: _Arcane/Objects/Misc/cards.rsi
    layers:
    - state: black_box
      map: [ closeLayer ]
    - state: black_box_open
      map: [ openLayer ]
      visible: false
    - state: black_box_full
      map: [ fullLayer ]
      visible: false
  - type: ContainerFill
    containers:
      storagebase:
      - CardDeckBlack


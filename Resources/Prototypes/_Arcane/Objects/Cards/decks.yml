- type: entity
  parent: BaseItem
  id: CardStackBase
  abstract: true
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Arcane/Objects/Misc/cards.rsi
    state: back_black
    drawdepth: SmallObjects
  - type: PlayingCards
  - type: PlayingCardsStorage
  - type: UseDelay
    delay: 0.5
  - type: UserInterface
    interfaces:
      enum.PlayingCardsUiKey.Key:
        type: PlayingCardsBoundUserInterface

- type: entity
  parent: CardStackBase
  id: CardBase
  name: card
  categories: [ HideSpawnMenu ]
  components:
  - type: Rotatable
  - type: EmitSoundOnLand
    sound:
      collection: ArcaneCardShove

- type: entity
  parent: CardStackBase
  id: CardHandBase
  name: hand of cards
  categories: [ HideSpawnMenu ]
  components:
  - type: PlayingCards
    kind: Hand

- type: entity
  parent: CardStackBase
  id: CardDeckBase
  name: deck of cards
  categories: [ HideSpawnMenu ]
  components:
  - type: Item
    size: Normal
  - type: PlayingCards
    kind: Deck
  - type: PlayingCardDeck

- type: entity
  parent: [ BoxCardboard, BaseBagOpenClose ]
  id: CardBoxBase
  name: deck box
  categories: [ HideSpawnMenu ]
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,1
  - type: ItemCounter
    count:
      components: [ PlayingCardDeck ]
    composite: true
    layerStates: [ fullLayer, fullLayer ]
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,1,1
    whitelist:
      components: [ PlayingCardDeck ]
  - type: ContainerFill
    containers:
      storagebase:
      - CardDeckBlack
  - type: Appearance


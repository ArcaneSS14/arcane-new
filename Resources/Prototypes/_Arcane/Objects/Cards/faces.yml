  id: CardScJokerBlack
  name: card-sc-joker
  state: joker
  components:
  - type: EmbeddableProjectile
    netsync: false
    sound: /Audio/Weapons/star_hit.ogg
  - type: ThrowingAngle
    netsync: false
    angularVelocity: true # spins
  - type: ThrowableBlocked
    netsync: false
  - type: LandAtCursor
    netsync: false
  - type: DamageOtherOnHit
    netsync: false
    ignoreResistances: true
    damage:
      types:
        Slash: 0.1
  - type: Solution
    netsync: false
    id: injector
    solution:
      maxVol: 4
      reagents:
      - ReagentId: Bananadine
        Quantity: 1.5
      - ReagentId: Honk
        Quantity: 0.5
      - ReagentId: Laughter
        Quantity: 2
  - type: SolutionRegeneration
    netsync: false
    duration: 0.25
    generated:
      reagents:
      - ReagentId: Bananadine
        Quantity: 1.5
      - ReagentId: Honk
        Quantity: 0.5
      - ReagentId: Laughter
        Quantity: 2
  - type: SolutionInjectWhileEmbedded
    netsync: false
    transferAmount: 4
    updateInterval: 0.1
    maxInjections: 1
    solution: injector
    pierceArmor: false


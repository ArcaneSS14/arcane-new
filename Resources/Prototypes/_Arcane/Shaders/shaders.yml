- type: shader
  id: Flap
  kind: source
  path: "/Textures/_Arcane/Shaders/flap.swsl"

- type: shader
  id: LightingOverlay
  kind: source
  path: "/Textures/_Arcane/Shaders/light.swsl"

- type: shader
  id: LightGlow
  kind: source
  path: "/Textures/_Arcane/Shaders/glow.swsl"
  params:
    glow_brightness: 25
    outline_width: 4.0
    outline_alpha: 1
    draw_sprite: 0
    draw_halo: 0

# Blurred halo for regular unshaded sprites, without the lamp brightness boost.
- type: shader
  id: UnshadedGlow
  kind: source
  path: "/Textures/_Arcane/Shaders/glow.swsl"
  params:
    glow_brightness: 1
    outline_width: 3.0
    outline_alpha: 0.5
    draw_sprite: 1
    draw_halo: 0

- type: shader
  id: LightingHighlights
  kind: source
  path: "/Textures/_Arcane/Shaders/lighting_highlights.swsl"


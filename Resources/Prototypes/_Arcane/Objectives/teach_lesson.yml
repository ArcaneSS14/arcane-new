- type: entity
  abstract: true
  parent: [BaseTraitorObjective, BaseTargetObjective]
  id: BaseTeachALessonObjective
  components:
  - type: Objective
    unique: false
    icon:
      sprite: Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
  - type: ObjectiveBlacklistRequirement
    blacklist:
      components:
      - SocialObjective
  - type: TargetObjective
    title: objective-condition-teach-lesson-title
  - type: PickRandomPerson
    conditions:
    - !type:RoleCondition
      whitelist:
        components:
        - JobRole
    - !type:AntagonistTagCondition
      tags:
      - OnStation
    - !type:AntagonistTagCondition
      inverted: true
      tags:
      - Unkillable
    - !type:ObjectiveTargetCondition
      inverted: true
      whitelist:
        components:
        - TeachALessonCondition
  - type: TeachALessonCondition

- type: entity
  parent: BaseTeachALessonObjective
  id: TeachRandomPersonObjective
  description: Make sure they die at least once or leave the round for good. They know what they did.
  components:
  - type: Objective
    difficulty: 0.5

- type: entity
  parent: BaseTeachALessonObjective
  id: TeachRandomHeadObjective
  description: Make sure this head dies at least once or leaves the round for good. They know what they did.
  components:
  - type: Objective
    difficulty: 1
    unique: true
  - type: PickRandomPerson
    conditions:
    - !type:BodyWhitelistCondition
      blacklist:
        components:
        - NukeOperative
      whitelist:
        components:
        - CommandStaff

# Ghosts locked to one ckey; hidden from everyone else in the lobby picker.
- type: customGhost
  id: CkeyPersonal
  abstract: true
  category: personal
  entity: MobObserver

# PuroSlavKing
- type: customGhost
  parent: CkeyPersonal
  id: VecortysGhost
  restrictions:
  - !type:CkeyRestriction
    ckey: [ Vecortys ]
  entity: MobObserverVecortys

- type: entity
  id: MobObserverVecortys
  parent: MobObserver
  categories: [ HideSpawnMenu ]
  description: Hush, hush.
  components:
  - type: Sprite
    sprite: _Arcane/Ghosts/ckey/Vecortys.rsi
    color: "#ffffff80" # 0.5 alpha
  - type: MovementSpeedModifier
    baseSprintSpeed: 22


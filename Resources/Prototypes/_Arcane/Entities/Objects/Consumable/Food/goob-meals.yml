- type: entity
  parent: FoodPizzaCotton
  id: FoodPizzaCottonHot
  name: flamin hot cotton pizza
  description: Flat fabric cotton dough with super spicy cotton topping. Flamin hot!
  components:
  - type: FlavorProfile
    flavors: [cotton, bread, spicy]
  - type: Sprite
    sprite: _Arcane/Objects/Consumable/Food/cotton-pizza-hot.rsi
    layers:
    - state: cotton-pizza-hot
  - type: ToolRefinable
    refineResult:
    - id: FoodPizzaCottonHotSlice
      amount: 8
  - type: Solution
    solution:
      maxVol: 40
      reagents:
      - ReagentId: Nutriment
        Quantity: 20
      - ReagentId: Vitamin
        Quantity: 5
      - ReagentId: Fiber
        Quantity: 5
      - ReagentId: CapsaicinOil
        Quantity: 5


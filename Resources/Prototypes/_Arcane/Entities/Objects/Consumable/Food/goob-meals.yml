- type: entity
  parent: FoodBurgerBase
  id: FoodBurgerCold
  name: five below burger
  description: COLD! COLD! COLD!
  components:
  - type: Item
    heldPrefix: plain
  - type: FlavorProfile
    flavors: [meaty, cold]
  - type: Sprite
    sprite: _Arcane/Objects/Consumable/Food/chilly_pepper_food.rsi
    layers:

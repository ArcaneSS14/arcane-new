- type: entity
  parent: FoodBurgerBase
  id: FoodBurgerMustard
  name: mothroachburger
  description: The last lamp it saw was the one inside the microwave.
  components:
  - type: Item
    heldPrefix: plain
  - type: FlavorProfile
    flavors: [bun, meaty, light]
  - type: Sprite
    sprite: _Arcane/Objects/Consumable/Food/mothroach_burger.rsi
    layers:
    - state: mustard_mothroach
  - type: Solution
    solution:
      # Preserve all 17u from Goob; its original 15u capacity was too small.
      maxVol: 17
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Protein
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 7
  - type: Tag
    tags: [Meat]

- type: entity

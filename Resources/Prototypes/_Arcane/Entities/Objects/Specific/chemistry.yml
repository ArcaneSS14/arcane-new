- type: entity
  parent: [BaseBeakerMetallic, BaseOpenableBeaker]
  id: XLargeBeaker
  name: X-large beaker
  description: An extra-large beaker.
  components:
  - type: Spillable
    solution: beaker
  - type: Sprite
    sprite: _Arcane/Objects/Specific/Chemistry/beaker_x_large.rsi
    layers:
    - state: beakerxlarge
    - state: beakerxlarge1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: lid_beakerxlarge
      map: ["enum.OpenableVisuals.Layer"]
      visible: false
  - type: Item
    sprite: _Arcane/Objects/Specific/Chemistry/beaker_x_large.rsi
    size: Normal
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: beakerxlarge
    inHandsMaxFillLevels: 4
    inHandsFillBaseName: -fill-
  - type: Solution
    solution:
      maxVol: 150
  - type: PhysicalComposition
    materialComposition:
      Glass: 62
      Plastic: 75
  - type: StaticPrice
    price: 30

- type: entity
  parent: XLargeBeaker
  id: MetamaterialBeaker
  name: metamaterial beaker
  description: An enormous, metamaterial-reinforced beaker.
  components:
  - type: Sprite
    sprite: _Arcane/Objects/Specific/Chemistry/beaker_metamaterial.rsi
    layers:
      - state: beakermetamaterial
      - state: beakermetamaterial1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
      - state: lid_beakermetamaterial
        map: ["enum.OpenableVisuals.Layer"]
        visible: false
  - type: Item
    sprite: _Arcane/Objects/Specific/Chemistry/beaker_metamaterial.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 8
    fillBaseName: beakermetamaterial
    inHandsMaxFillLevels: 5
    inHandsFillBaseName: -fill-
  - type: Solution
    solution:
      maxVol: 200
  - type: PhysicalComposition
    materialComposition:
      Glass: 62
      Plastic: 75
      Gold: 25
      Silver: 25
  - type: StaticPrice
    price: 60

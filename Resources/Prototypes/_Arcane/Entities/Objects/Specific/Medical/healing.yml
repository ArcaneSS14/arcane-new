- type: entity
  name: advanced regenerative mesh
  description: Used to treat even the nastiest burns. Also effective against caustic burns.
  parent: BaseHealingItem
  id: AdvancedRegenerativeMeshOpened
  suffix: Full
  components:
  - type: Tag
    tags:
    - Ointment
  - type: Sprite
    state: aloe-mesh-3
    layers:
    - state: aloe-mesh-3
      map: ["base"]
  - type: Item
    heldPrefix: aloe-mesh
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Heat: -15
        Cold: -15
        Shock: -15
        Caustic: -15
    healingBeginSound:
      collection: RegenerativeMeshBegin
      params:
        volume: 4.0
        variation: 0.125
    healingEndSound:
      collection: RegenerativeMeshContinuous
      params:
        volume: 4.0
        variation: 0.125
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Arcane/Items/Medical/regenerative_mesh/regen_mesh_drop1.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Arcane/Items/Medical/regenerative_mesh/regen_mesh_drop1.ogg
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Arcane/Items/Medical/regenerative_mesh/regen_mesh_pickup1.ogg
  - type: Stack
    stackType: AdvancedRegenerativeMesh
    count: 15
    baseLayer: base
    layerStates:
    - aloe-mesh
    - aloe-mesh-2
    - aloe-mesh-3
  - type: StackPrice
    price: 40

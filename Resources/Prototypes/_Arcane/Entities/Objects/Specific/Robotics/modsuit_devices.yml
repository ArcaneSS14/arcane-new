- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: BaseModsuitModuleDevice
  components:
  - type: ContainerContainer
    containers:
      mod-device: !type:ContainerSlot

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleHealthAnalyzer
  name: MOD health analyzer module
  description: Scans patients from a device built into the suit's glove.
  components:
  - type: Sprite
    state: health
  - type: ModModule
    moduleType: Active
    complexity: 1
    activePower: 0.2
    requiredParts: [ gloves ]
  - type: ModDeviceModule
    device: ModsuitDeviceHealthAnalyzer

- type: entity
  parent: HandheldHealthAnalyzer
  id: ModsuitDeviceHealthAnalyzer
  name: MOD health analyzer
  categories: [ HideSpawnMenu ]

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleGps
  name: MOD GPS module
  description: Shows the wearer's coordinates.
  components:
  - type: Sprite
    state: gps
  - type: ModModule
    moduleType: Active
    complexity: 1
    activePower: 0.2
  - type: ModDeviceModule
    device: ModsuitDeviceGps

- type: entity
  parent: HandheldGPSBasic
  id: ModsuitDeviceGps
  name: MOD GPS
  categories: [ HideSpawnMenu ]
  components:
  - type: StaticPrice
    price: 0
  - type: PhysicalComposition
    materialComposition: {}

- type: entity

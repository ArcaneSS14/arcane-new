- type: entity
  parent: PartModsuit
  id: ModsuitCorePlasma
  name: MOD plasma core
  description: A core that can be refueled with plasma sheets. It holds less charge than a standard core.
  components:
  - type: Sprite
    state: mod-core-standard
    color: "#d07bff"
  - type: Icon
    state: mod-core-standard
  - type: Tag
    tags: [ ModsuitPart, ModsuitCore ]
  - type: ModCore
  - type: Battery
    maxCharge: 720
    startingCharge: 720
  - type: ModCoreRefuelable
    fuel:
      tags: [ SheetPlasma ]
    chargePerFuel: 180
  - type: PhysicalComposition
    materialComposition:
      Plasma: 100
      Glass: 25
  - type: StaticPrice
    price: 75


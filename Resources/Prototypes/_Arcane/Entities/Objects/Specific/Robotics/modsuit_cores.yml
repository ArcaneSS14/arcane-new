- type: entity
  parent: PartModsuit
  id: ModsuitCoreStandardMicroreactor
  name: MOD microreactor core
  description: A sealed MOD core built around a miniature reactor. It holds a modest charge that slowly regenerates on its own.
  components:
  - type: Sprite
    state: mod-core-standard
    color: "#7dffb0"
  - type: Icon
    state: mod-core-standard
  - type: Tag
    tags: [ ModsuitPart, ModsuitCore ]
  - type: ModCore
  - type: Battery
    maxCharge: 1080
    startingCharge: 1080
  - type: BatterySelfRecharger
    autoRechargeRate: 3
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Glass: 50
      Uranium: 25
  - type: StaticPrice
    price: 150

- type: entity
  parent: PartModsuit
  id: ModsuitCoreStandardAntique

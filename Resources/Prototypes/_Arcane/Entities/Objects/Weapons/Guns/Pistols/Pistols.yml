- type: entity
  parent: [ BaseMajorContraband, WeaponPistolViper ]
  id: WeaponPistolInteQCommissar
  name: Commissar
  suffix: Pistol
  description: Small, easily concealable, but somewhat underpowered gun. Retrofitted with a fully automatic receiver. Uses .35 auto ammo. It is painted in the InteQ brand color.
  components:
  - type: Sprite
    sprite: _Arcane/Objects/Weapons/Guns/Pistols/inteq_commissar.rsi
  - type: Gun
    selectedMode: FullAuto
    availableModes:
      - SemiAuto
      - FullAuto

- type: entity
  parent: [BaseWeaponPistol, BaseSecurityContraband]
  id: WeaponPistolG22
  name: G-22
  description: A popular police firearm in the modern day. Chambered in 9mm rounds.
  components:
  - type: Sprite
    sprite: _Arcane/Objects/Weapons/Guns/Pistols/glock22/big.rsi
    scale: 0.9, 0.9
  - type: Item
    sprite: _Arcane/Objects/Weapons/Guns/Pistols/glock22/tiny.rsi
  - type: Gun
    angleDecay: 7
    angleIncrease: 2
    cameraRecoilScalar: 0.5
    fireRate: 5
    maxAngle: 13
    minAngle: 1
  - type: ItemSlots
    slots:
      gun_magazine:
        startingItem: MagazinePistol
        insertSound: /Audio/_Arcane/Weapons/Guns/Pistols/beretta_reload.ogg
        ejectSound: /Audio/_Arcane/Weapons/Guns/Pistols/beretta_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol
      gun_chamber:
        startingItem: CartridgePistol
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true

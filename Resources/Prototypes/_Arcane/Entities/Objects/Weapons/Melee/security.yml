- type: entity
  parent: [BaseItem, BaseSecurityContraband]
  id: Betty
  name: Betty
  description: An old intricate souvenir made from tough hyper-woven durathread repurposed for riot combat.
  components:
  - type: Sprite
    sprite: _Arcane/Objects/Weapons/Melee/betty.rsi
    state: icon
  - type: DisarmMalus
    malus: 0.5
  - type: UseDelay
    delay: 10
  - type: Item
    heldPrefix: off
    sprite: _Arcane/Objects/Weapons/Melee/betty.rsi
    shape:
    - 0,0,2,0
    storedRotation: 45
  - type: Tool
    qualities:
    - Slicing
  - type: MeleeWeapon
    animationRotation: 225
    wideAnimationRotation: -135
    attackRate: 0.8
    damage:
      types:
        Slash: 18
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: ItemSwitch
    state: off
    states:
      off: !type:ItemSwitchState
        sprite:
          sprite: _Arcane/Objects/Weapons/Melee/betty.rsi
          state: icon
        components:
        - type: Item
          sprite: _Arcane/Objects/Weapons/Melee/betty.rsi
          shape:
          - 0,0,2,0
          storedRotation: 45
        - type: Tool
          qualities:
          - Slicing
        - type: MeleeWeapon
          animationRotation: 225
          wideAnimationRotation: -135
          attackRate: 0.8
          damage:
            types:
              Slash: 18
          soundHit:
            path: /Audio/Weapons/bladeslice.ogg
        soundStateActivate:
          path: /Audio/_Goobstation/Misc/umbrella.ogg
      on: !type:ItemSwitchState
        sprite:
          sprite: _Arcane/Objects/Weapons/Melee/betty.rsi
          state: icon-on
        components:
        - type: HeldSpeedModifier
          walkModifier: 0.5
          sprintModifier: 0.5
        - type: MeleeWeapon
          mustBeEquippedToUse: true # Only automatic counterattacks use this state.
          damage:
            types:
              Blunt: 30
          soundHit:
            collection: TrayHit
        - type: MeleeThrowOnHit
          throwWhileOnDelay: true
          distance: 3
        - type: KnockdownOnHit
        - type: MultiHandedItem
        - type: StaminaDamageOnHit
          damage: 75
        - type: Item
          size: Ginormous
          sprite: _Arcane/Objects/Weapons/Melee/betty.rsi
          heldPrefix: on
          storedRotation: -45
        - type: CounterattackWeapon
          setItemSwitch: off
        soundStateActivate:
          path: /Audio/_Goobstation/Misc/umbrella.ogg

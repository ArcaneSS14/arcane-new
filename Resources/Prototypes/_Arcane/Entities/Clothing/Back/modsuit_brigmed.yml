- type: entity
  parent: [ClothingModsuitStandard, BaseSecurityContraband]
  id: ClothingModsuitBrigMed
  name: security trauma modsuit control unit
  description: A robust modular hardsuit control module unit for healing commies in space.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Arcane/Clothing/Back/Modsuits/brigmed.rsi
  - type: ModSuit
    theme: ModThemeBrigMed
    parts:
      head: ClothingModsuitHelmetBrigMed
      gloves: ClothingModsuitGauntletsBrigMed
      outerClothing: ClothingModsuitChestplateBrigMed
      shoes: ClothingModsuitBootsBrigMed
  - type: Construction
    graph: Modsuit
    node: brigmed
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-sealed

- type: entity
  parent: ClothingModsuitBrigMed
  id: ClothingModsuitBrigMedPowerCell
  suffix: High-Capacity Battery
  components:
  - type: ContainerFill
    containers:
      mod-core:
      - ModsuitCoreStandardHighCapacity

- type: entity
  parent: BaseClothingModsuitHelmet
  id: ClothingModsuitHelmetBrigMed
  name: trauma modsuit helmet
  description: Cool helmet without eye lenses. Eyes aren't needed for surgery.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HEAD
      head-vox:
      - state: equipped-HEAD-vox
      head-vulpkanin:
      - state: equipped-HEAD-vulpkanin
      head-feroxi:
      - state: equipped-HEAD-feroxi
      head-hydrakin:
      - state: equipped-HEAD-hydrakin
  - type: Sprite
    sprite: _Arcane/Clothing/Head/Modsuits/brigmed.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      map: [ "sealed" ]
  - type: HideLayerClothing
    slots:
    - Snout
  - type: ContainerContainer
    containers:
      mod-part-stored: !type:ContainerSlot
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-helmet
    sealDownPopup: sealable-clothing-seal-down-helmet
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      head:
      - state: equipped-HEAD-sealed
      head-resomi:
      - state: equipped-HEAD-sealed
      head-vox:
      - state: equipped-HEAD-sealed-vox
      head-vulpkanin:
      - state: equipped-HEAD-sealed-vulpkanin
      head-feroxi:
      - state: equipped-HEAD-sealed-feroxi
      head-hydrakin:
      - state: equipped-HEAD-sealed-hydrakin
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.75
        Heat: 0.75
        Radiation: 0.6
  - type: ComponentToggler
    components:
    - type: BreathMask
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coefficient: 0.01
    - type: IdentityBlocker
    - type: IngestionBlocker
    - type: HideLayerClothing
      slots:
      - Hair
      - Snout
      - HeadTop
      - HeadSide
  - type: PointLight
    enabled: false
    radius: 5
    energy: 3
    lightMask: ConeSingle
    autoRot: true
    netsync: true

- type: entity
  parent: ClothingOuterBase
  id: ClothingModsuitChestplateBrigMed
  name: trauma modsuit chestplate
  description: A robust modular suit cover with white ceramic inserts for extra drip.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: AllowSuitStorage
  - type: Sprite
    sprite: _Arcane/Clothing/OuterClothing/Modsuits/brigmed.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ outerClothing ]
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ContainerContainer
    containers:
      mod-part-stored: !type:ContainerSlot
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-chestplate
    sealDownPopup: sealable-clothing-seal-down-chestplate
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
      outerClothing-resomi:
      - state: equipped-OUTERCLOTHING-sealed-resomi
      outerClothing-vox:
      - state: equipped-OUTERCLOTHING-sealed-vox
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: ModifyDelayedKnockdown
    delayDelta: 2.5
    knockdownTimeDelta: -2.5
  - type: StaminaResistance
    damageCoefficient: 0.7
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    coverage:
    - Torso
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Other
    modifiers:
      coefficients:
        Blunt: 0.72
        Slash: 0.72
        Piercing: 0.72
        Heat: 0.72
        Radiation: 0.6
  - type: ComponentToggler
    components:
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coefficient: 0.01
  - type: FireProtection
    reduction: 0.5

- type: entity
  parent: ClothingHandModsuitBase
  id: ClothingModsuitGauntletsBrigMed
  name: trauma modsuit gauntlets
  description: Cool gauntlets.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Arcane/Clothing/Hands/Modsuits/brigmed.rsi
    layers:
    - state: gauntlets
    - state: gauntlets-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ gloves ]
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10
  - type: Fiber
    fiberMaterial: fibers-modular
    fiberColor: fibers-black
  - type: FingerprintMask
  - type: ContainerContainer
    containers:
      mod-part-stored: !type:ContainerSlot
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-gauntlets
    sealDownPopup: sealable-clothing-seal-down-gauntlets
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      gloves:
      - state: equipped-HAND-sealed
      gloves-vox:
      - state: equipped-HAND-sealed-vox

- type: entity
  parent: ClothingShoesBase
  id: ClothingModsuitBootsBrigMed
  name: trauma modsuit boots
  description: Cool boots.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Arcane/Clothing/Shoes/Modsuits/brigmed.rsi
    layers:
    - state: boots
    - state: boots-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ feet ]
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: ContainerContainer
    containers:
      mod-part-stored: !type:ContainerSlot
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-boots
    sealDownPopup: sealable-clothing-seal-down-boots
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      shoes:
      - state: equipped-FEET-sealed
      shoes-vox:
      - state: equipped-FEET-sealed-vox
      shoes-feroxi:
      - state: equipped-FEET-sealed-feroxi
      shoes-reptilian:
      - state: equipped-FEET-sealed-reptilian
  - type: ClothingSlowOnDamageModifier
    modifier: 0.5
  - type: ModifyStandingUpTime
    multiplier: 0.5
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.1
      OrganDamage: 0.1
      BoneDamage: 0.1
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95

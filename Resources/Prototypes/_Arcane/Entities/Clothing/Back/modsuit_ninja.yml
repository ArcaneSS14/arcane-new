- type: modTheme
  id: ModThemeNinja
  chargeDrain: 0

- type: entity
  parent: [ClothingModsuitStandard, BaseToggleClothing, BaseHighlyIllegalContraband]
  id: ClothingModsuitNinja
  name: Spider Clan MOD control unit
  description: A modular space suit fitted for Spider Clan operatives.
  components:
  - !Remove type: Construction
  - type: Sprite
    sprite: Clothing/Back/Satchels/ninja.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: Clothing/Back/Satchels/ninja.rsi
  - !Remove type: SealableClothingVisuals
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: Storage
    storageOpenSound: null
    storageInsertSound: null
  - type: ModSuit
    theme: ModThemeNinja
    parts:
      head: ClothingModsuitHelmetNinja
      outerClothing: ClothingModsuitChestplateNinja
      gloves: ClothingModsuitGauntletsNinja
      shoes: ClothingModsuitBootsNinja
  - type: ContainerFill
    containers:
      mod-core:
      - ModsuitCoreNinja
  - type: NinjaSuit
    empAction: null
  - type: EmpResistance
    strengthMultiplier: 0
  - type: ToggleClothing
    action: ActionTogglePhaseCloak
    disableOnUnequip: true
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      hadOutline: true
      thermalsImmune: true
      minVisibility: 0.1
      lastVisibility: 0.1
      shimmerFrequency: 0.05
  - type: ItemCreator
    action: ActionCreateThrowingStar
    charge: 14.4
    spawnedPrototype: ThrowingStarNinja
    noPowerPopup: ninja-no-power

- type: entity
  parent: ModsuitCoreStandard
  id: ModsuitCoreNinja
  suffix: Spider Clan
  categories: [HideSpawnMenu]
  components:
  - type: EmpResistance
    strengthMultiplier: 0
  - type: ContainerFill
    containers:
      cell_slot:
      - PowerCellSmall

- type: entity
  parent: ClothingHeadHelmetSpaceNinja
  id: ClothingModsuitHelmetNinja
  categories: [HideSpawnMenu]
  components:
  - !Remove type: PressureProtection
  - type: ContainerContainer
    containers:
      mod-part-stored: !type:ContainerSlot
  - type: ModPart
    sealedComponents:
    - type: PressureProtection
      highPressureMultiplier: 0.6
      lowPressureMultiplier: 1000

- type: entity
  parent: [ClothingOuterBaseLargeInsulated, AllowSuitStorageClothing, BaseHighlyIllegalContraband]
  id: ClothingModsuitChestplateNinja
  name: Spider Clan MOD chestplate
  description: A retractable nano-weave breastplate for the Spider Clan MOD.
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/spaceninja.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/spaceninja.rsi
  - type: ContainerContainer
    containers:
      mod-part-stored: !type:ContainerSlot
  - type: ModPart
    sealedComponents:
    - type: PressureProtection
      highPressureMultiplier: 0.6
      lowPressureMultiplier: 1000
  - type: Armor
    coverage: [Torso, Arm, Hand, Leg, Foot, Tail, Wings]
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8

- type: entity
  parent: ClothingHandsGlovesSpaceNinja
  id: ClothingModsuitGauntletsNinja
  categories: [HideSpawnMenu]
  components:
  - type: ContainerContainer
    containers:
      mod-part-stored: !type:ContainerSlot

- type: entity
  parent: ClothingShoesSpaceNinja
  id: ClothingModsuitBootsNinja
  categories: [HideSpawnMenu]
  components:
  - type: ContainerContainer
    containers:
      mod-part-stored: !type:ContainerSlot

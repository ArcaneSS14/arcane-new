- type: entity
  parent: [Clothing, SolutionFood]
  id: BaseClothingPants
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Arcane/Clothing/Underwear/underpants.rsi
    layers:
    - state: icon-box
  - type: Clothing
    sprite: _Arcane/Clothing/Underwear/underpants.rsi
    clothingVisuals:
      pants:
      - state: equipped-box
    slots: [pants]
  - type: Butcherable
    spawned:
    - id: MaterialCloth1
      amount: 1
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 15
  - type: Tag
    tags:
    - ClothMade
  - type: StealTarget
    stealGroup: Pants


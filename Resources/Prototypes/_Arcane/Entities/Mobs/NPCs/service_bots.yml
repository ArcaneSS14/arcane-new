- type: entity
  parent: MobSiliconBase
  id: MobFillBot
  name: fillbot
  description: Picks up compatible loose materials and loads the machine linked with a multitool. When linked to a disposal unit, it collects loose trash.
  components:
  - type: Fillbot
  - type: Sprite
    sprite: _Arcane/Mobs/Silicon/Bots/fillbot.rsi
    state: fillbot
  - type: Construction
    graph: FillBot
    node: bot
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
  - type: NoSlip
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: Hands
    showInHands: false
    startingHands:
      hand_right:
        location: Right
  - type: ComplexInteraction
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: HTN
    rootTask:
      task: FillbotCompound
  - type: DeviceLinkSource
    ports:
    - FillItems
  - type: InteractionPopup
    interactSuccessString: petting-success-fillbot
    interactFailureString: petting-failure-fillbot
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg

- type: entity
  parent: MobSiliconBase
  id: MobPlantbot
  name: plantbot
  description: A botanist's best friend! It waters and weeds nearby trays automatically.
  components:
  - type: Plantbot
  - type: Sprite
    sprite: _Arcane/Mobs/Silicon/Bots/plantbot.rsi
    state: plantbot
  - type: HTN
    rootTask:
      task: PlantbotCompound
  - type: Construction
    graph: PlantBot
    node: bot
  - type: NoSlip
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 110
      behaviors:
      - !type:TriggerBehavior
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:DoActsBehavior
        acts: ["Destruction"]
  # This solution only spills on destruction. Servicing does not consume it.
  - type: SolutionContainerManager
    solutions:
      tank:
        reagents:
        - ReagentId: Water
          Quantity: 100
  - type: Anchorable
  - type: InteractionPopup
    interactSuccessString: petting-success-plantbot
    interactFailureString: petting-failure-plantbot
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: ShowHealthBars
    damageContainers:
    - Inorganic
    - Silicon
  - type: ShowHealthIcons
    damageContainers:
    - Inorganic
    - Silicon

- type: entity
  id: VisitorCivilianBase
  abstract: true
  parent: MarkerBase
  categories: [ Spawner ]
  components:
    - type: GhostTakeoverAvailable
    - type: GhostRole
      name: ghost-role-information-civilian-name
      description: ghost-role-information-civilian-description
      rules: ghost-role-information-nonantagonist-rules
      raffle:
        settings: short
    - type: CloningAppearance
      components:
        - type: IdBind
        - type: RandomMetadata
          nameSegments:
          - NamesFirst
          - NamesLast
          nameFormat: name-format-standard


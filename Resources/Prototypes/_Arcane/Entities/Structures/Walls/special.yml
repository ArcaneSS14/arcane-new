- type: entity
  parent: BaseWall
  id: WallClown
  name: bananium wall
  components:
  - type: RadiationBlocker
    resistance: 40
  - type: CosmicCorruptible
    convertTo: WallCosmicCult
  - type: Sprite
    sprite: _Arcane/Structures/Walls/bananium.rsi
  - type: Icon
    sprite: _Arcane/Structures/Walls/bananium.rsi
  - type: Construction
    graph: Girder
    node: bananiumWall
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: bananium
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 8000 # really good ramming wall, bananium is rare so it's probably fine


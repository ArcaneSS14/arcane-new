- type: entity
  parent: BaseWall
  id: WallPlastic
  name: plastic wall
  components:
  - type: CosmicCorruptible
    convertTo: WallCosmicCult
  - type: Sprite
    sprite: _Arcane/Structures/Walls/plastic.rsi
  - type: Icon
    sprite: _Arcane/Structures/Walls/plastic.rsi
  - type: Construction
    graph: Girder
    node: plasticWall
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: plastic

- type: entity
  parent: BaseWall
  id: WallNecropolis
  name: stone wall
  components:
  - type: Sprite
    sprite: _Arcane/Structures/Walls/necropolis.rsi
  - type: Icon
    sprite: _Arcane/Structures/Walls/necropolis.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: necropolis
  - type: RustRequiresPathStage
    pathStage: 10 # Ascension
  - type: CosmicCorruptible
    convertTo: WallCosmicCult

- type: entity
  parent: BaseWall
  id: WallPaper
  name: paper wall
  description: Helps to contain the repeated screams of martial artists.
  components:
  - type: Sprite
    sprite: _Arcane/Structures/Walls/paper.rsi
  - type: Icon
    sprite: _Arcane/Structures/Walls/paper.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: Construction
    graph: wallPaper
    node: wallPaper
  - type: IconSmooth
    key: walls
    base: paperwall

- type: entity
  parent: BaseWall
  id: WallBinaryIndestructible
  name: tear in the fabric of reality
  suffix: Indestructible
  components:
  - type: Sprite
    sprite: _Arcane/Structures/Walls/binary.rsi
    noRot: true
    layers:
    - state: full
      shader: unshaded
  - type: Icon
    sprite: _Arcane/Structures/Walls/binary.rsi
  - type: Destructible
  - type: RustRequiresPathStage
    pathStage: 11 # Can't rust

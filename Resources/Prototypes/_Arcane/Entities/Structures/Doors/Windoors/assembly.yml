- type: entity
  parent: BaseWindoorAssembly
  id: WindoorAssemblyClockwork
  name: clockwork windoor assembly
  description: It opens, it closes, and you can see through it! This one looks tough.
  components:
  - type: Sprite
    sprite: _Arcane/Structures/Doors/Windoors/clockwork_windoor.rsi
    layers:
    - state: open
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetBrass1: *BaseWindoorDrop
  - type: Construction
    graph: Windoor
    node: assemblyClockwork

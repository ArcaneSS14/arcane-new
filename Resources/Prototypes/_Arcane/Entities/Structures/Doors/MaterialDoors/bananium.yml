- type: entity
  parent: BaseMaterialDoorNavMap
  id: BananiumDoor
  name: bananium door
  components:
  - type: Sprite
    sprite: _Arcane/Structures/Doors/MaterialDoors/bananium-door.rsi
  - type: Door
    openSound: &BikeHornSound
      collection: BikeHorn
      params:
        variation: 0.125
    closeSound: *BikeHornSound
  - type: Construction
    graph: DoorGraph
    node: bananiumDoor
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialBananium1:
            min: 1
            max: 2

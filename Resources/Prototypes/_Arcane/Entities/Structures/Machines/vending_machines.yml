- type: entity
  parent: VendingMachine
  id: VendingMachineInteQDrobe
  name: InteQDrobe
  description: Wardrobe machine encoded by the InteQ, contains elite outfits for various operations.
  components:
  - type: VendingMachine
    pack: InteQDrobeInventory
  - type: SpeakOnUIClosed
    pack: InteQDrobeAds
  - type: Sprite
    sprite: _Arcane/Structures/Machines/VendingMachines/inteqdrobe.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#FF8C00"
  - type: AccessReader
    access: [["InteQVanguardLeader"], ["InteQVanguard"]]

- type: entity
  parent: VendingMachineInteQDrobe
  id: VendingMachineInteQDrobeNerf
  suffix: For station hiden places
  components:
  - type: VendingMachine
    pack: InteQDrobeNerfInventory

- type: entity
  parent: VendingMachine
  id: CaptainDrobe
  name: CaptainDrobe
  description: Stylish uniform, for a strong leader!
  components:
  - type: VendingMachine
    pack: CaptainDrobeInventory
  - type: Sprite
    sprite: _Arcane/Structures/Machines/VendingMachines/captaindrobe.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    color: "#05DAF2"
  - type: AccessReader
    access: [["Captain"]]

- type: entity
  parent: VendingMachine
  id: VendingMachineBitrunning
  name: Bitrunning Supplies Order
  description: A supplies order vending that exchanges bitrunning points for bitrunning goods.
  components:
  - type: VendingMachine
    pack: EmptyVendingMachineInventory
  - type: Sprite
    sprite: _Arcane/Structures/Machines/VendingMachines/bitrun.rsi
    noRot: true
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: "normal-unshaded"
      map: ["enum.VendingMachineVisualLayers.Screen"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    color: "#4f8dcf"
    autoRot: true
  - type: Transform
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: false
    rotateWhilePulling: true
  - type: ShopVendor
    pack: BitrunningVendorInventory
  - type: UserInterface
    interfaces:
      enum.VendingMachineUiKey.Key:
        type: ShopVendorBoundUserInterface
  - type: BitrunningPointsVendor

- type: entity
  parent: VendingMachine
  id: VendingMachineLove
  name: LoveMate
  description: A wide selection of fun for you!
  components:
  - type: VendingMachine
    pack: LoveMateInventory
  - type: VendingMachineVisuals
    denyState: deny-unshaded
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Sprite
    sprite: _Arcane/Structures/Machines/VendingMachines/lovemate.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 2
    energy: 1.6
    color: "#d64bc3"
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
  - type: Tag
    tags:
      - DroneUsable # Goobstation


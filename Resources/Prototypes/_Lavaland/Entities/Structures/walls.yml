- type: entity
  parent: BaseWall
  id: WallHierophantArena
  name: hierophant wall
  components:
  - type: Sprite
    sprite: _Lavaland/Structures/Walls/hierophant.rsi
  - type: Icon
    sprite: _Lavaland/Structures/Walls/hierophant.rsi
  - type: Destructible
  - type: IconSmooth
    # Arcane-Edit-Start
    key: walls
    states:
    - !type:CornerSpriteSmoothing
      mask: [ walls ]
      base: hierophant
    # Arcane-Edit-End
  - type: SyncSprite
  - type: PointLight
    radius: 5.0
    energy: 1.5
    softness: 1
    castShadows: false
  - type: RustRequiresPathStage
    pathStage: 11 # Can't rust

- type: entity
  parent: BaseWall
  id: WallHierophantArenaTemporary
  name: hierophant field
  description: "Keeps the salvager in and... Why are you looking at this in a middle of a fight? You have nothing to do?!"
  components:
  - type: Sprite
    sprite: _Lavaland/Structures/Walls/hierophant_temp.rsi
  - type: Icon
    sprite: _Lavaland/Structures/Walls/hierophant_temp.rsi
  - type: Destructible
  - type: IconSmooth
    # Arcane-Edit-Start
    key: hierofield
    states:
    - !type:CornerSpriteSmoothing
      mask: [ hierofield ]
      base: hierotemp
      shader: UnshadedGlow
    # Arcane-Edit-End
  - type: Occluder
    enabled: false
  - type: RustRequiresPathStage
    pathStage: 11 # Can't rust

- type: entity
  parent: BaseWall
  id: WallNecropolisIndestructible
  name: stone wall
  suffix: Indestructible
  components:
  - type: Sprite
    sprite: _Arcane/Structures/Walls/necropolis.rsi
  - type: Icon
    sprite: _Arcane/Structures/Walls/necropolis.rsi
  - type: IconSmooth
    # Arcane-Edit-Start
    key: walls
    states:
    - !type:CornerSpriteSmoothing
      mask: [ walls ]
      base: necropolis
    # Arcane-Edit-End
  - type: Destructible
  - type: RustRequiresPathStage
    pathStage: 11 # Can't rust

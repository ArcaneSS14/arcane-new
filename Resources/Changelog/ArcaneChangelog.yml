- author: Pawn, Partheo, UmbiMax
  changes:
  - type: Add
    message: Новые спрайты ТЭГа с 13 станции, включая панели, поломку и анимации работы.
  - type: Add
    message: Мультитулом можно переключать горячий и холодный режим циркулятора за 2 секунды. Режим сохраняется независимо от температуры газа.
  - type: Add
    message: Ломом можно развернуть поток циркулятора. Оба действия доступны и на закреплённых деталях с ЗАКРЫТОЙ ПАНЕЛЬЮ.
  - type: Add
    message: При осмотре циркулятора отображаются режим, давление и температура на входе и выходе.
  - type: Add
    message: Добавлены платы для сборки генератора и циркуляторов.
  - type: Tweak
    message: Детали ТЭГа ломаются при 100 урона и отключают комплект. Окончательно с 175. Сварочный ремонт восстанавливает по 25 урона за 5 секунд. После полного ремонта работа возобновляется автоматически.
  - type: Tweak
    message: ТЭГ нельзя разобрать, если урона > 25.
  - type: Tweak
    message: При уничтожении детали ТЭГа остаётся уничтоженная машинная рама, а плата и компоненты выпадают на пол.
